# lychee (リンク切れ検出) の設定。.github/workflows/lychee.yml から自動で読まれる。
exclude = [
  # ドキュメント中の例示 URL
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  # 参考として記載している genzouw/ptasuku は存在しない (オーナー権限の gh でも解決できない)。
  # README と過去の設計記録に参照が残るため、リンクは残したまま検査対象から外す
  '^https://github\.com/genzouw/ptasuku',
]

# ビルド時に置換されるプレースホルダ (__SITE_ORIGIN__) とルート相対リンクを含むテンプレート
exclude_path = ['frontend/index.html']
