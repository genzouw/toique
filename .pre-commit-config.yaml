minimum_pre_commit_version: '3.0.0'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 2c9f875913ee60ca25ce70243dc24d5b6415598c # frozen: v4.6.0 # pragma: allowlist secret
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1 # pragma: allowlist secret
    hooks:
      - id: gitleaks
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # frozen: v1.5.0 # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline', '--no-verify']
        exclude: '(^|/)\.secrets\.baseline$'
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # frozen: v3.99.8 # pragma: allowlist secret
    hooks:
      - id: trufflehog
