name: PR Secret Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-secret-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # reviewdog が PR にコメントするために必要

jobs:
  reviewdog-gitleaks:
    name: reviewdog / gitleaks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks はコミット履歴全体をスキャンするため必要
          persist-credentials: false # このジョブは push を行わないため、資格情報を作業ツリーに残さない

      # reviewdog/action-gitleaks はリポジトリの Actions allowlist
      # (Settings > Actions > General > Allow select actions) に登録されておらず、
      # 起動前に必ず startup_failure する（sha_pinning_required かつ selected-actions 未登録のため）。
      # allowlist 登録済みの reviewdog/action-setup + gitleaks 公式リリースバイナリの
      # 直接インストールに置き換える（genzouw/ci-workflows の gitleaks.yml と同じ手法）。
      # この置き換えは副次的に Issue #712（reviewdog/action-gitleaks 内部の Dockerfile が
      # reviewdog/reviewdog@master という可変参照から install.sh を取得しており、
      # インストール元を固定できていない問題）も解消する。
      #
      # reviewdog_version を省略すると既定値 `latest` が使われ、action 内蔵の install.sh が
      # 実行時に GitHub API へ最新タグを問い合わせて解決するため、取得するバイナリの版が浮動する。
      # 同ジョブの gitleaks は GITLEAKS_VERSION で固定＋チェックサム検証まで行っているため、
      # 対称性を保つ意味でも、また -fail-level / -filter-mode の挙動が上流の変更で
      # 無自覚に変わることを避ける意味でも、reviewdog 側も明示的に版を固定する。
      # `with:` の値は Dependabot の更新対象外のため、GITLEAKS_VERSION と同様に手動更新する
      # （docs/security/leak-prevention.md の「バージョン更新時」の記述を参照）。
      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          curl -fsSLo checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${TARBALL}$" checksums.txt | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # gitleaks はコミット履歴全体をスキャンしますが、reviewdog 側の filter_mode（既定値
      # "added"）が本PRの差分行のみに注釈・失敗判定を絞り込みます。履歴上の既存シークレットの
      # 検知は、Push トリガーの gitleaks.yml と週次の定期監査が担うため、本ワークフローの役割は
      # 「このPRが新たに持ち込む差分」への即時フィードバックに限定しています。
      #
      # --exit-code 0 は「シークレットを検知した」場合の終了コードのみを上書きします
      # （reviewdog 側の filter-mode / fail-level で失敗判定するため）。gitleaks 本体の
      # 設定ファイルのパースエラーなどスキャン自体が異常終了した場合は gitleaks が独自に
      # exit 1 するため、set -euo pipefail によりこのステップは失敗し、旧 action の
      # `gitleaks detect ... || true` のように黙って green になることはありません。
      #
      # --config は "(--source)/.gitleaks.toml" の自動検出より優先されるため明示指定します
      # （旧 action の `gitleaks_config` input は action.yml が受け付けない未定義のinputで
      # 無視されていました）。
      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 0 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Report to PR via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          reviewdog \
            -f=sarif \
            -name=gitleaks \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=any \
            < gitleaks.sarif
