name: PR Secret Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-secret-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # reviewdog が PR にコメントするために必要

jobs:
  reviewdog-gitleaks:
    name: reviewdog / gitleaks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks は --no-git で作業ツリーのみをスキャンするため履歴は不要。
          # スキャン時間が履歴の伸びに依存しなくなる副次効果もある。
          persist-credentials: false # このジョブは push を行わないため、資格情報を作業ツリーに残さない

      # reviewdog/action-gitleaks はリポジトリの Actions allowlist
      # (Settings > Actions > General > Allow select actions) に登録されておらず、
      # 起動前に必ず startup_failure する（sha_pinning_required かつ selected-actions 未登録のため）。
      # allowlist 登録済みの reviewdog/action-setup + gitleaks 公式リリースバイナリの
      # 直接インストールに置き換える（genzouw/ci-workflows の gitleaks.yml と同じ手法）。
      # この置き換えは副次的に Issue #712（reviewdog/action-gitleaks 内部の Dockerfile が
      # reviewdog/reviewdog@master という可変参照から install.sh を取得しており、
      # インストール元を固定できていない問題）も解消する。
      #
      # reviewdog_version を省略すると既定値 `latest` が使われ、action 内蔵の install.sh が
      # 実行時に GitHub API へ最新タグを問い合わせて解決するため、取得するバイナリの版が浮動する。
      # 同ジョブの gitleaks は GITLEAKS_VERSION で固定＋チェックサム検証まで行っているため、
      # 対称性を保つ意味でも、また -fail-level / -filter-mode の挙動が上流の変更で
      # 無自覚に変わることを避ける意味でも、reviewdog 側も明示的に版を固定する。
      # `with:` の値は Dependabot の更新対象外のため、GITLEAKS_VERSION と同様に手動更新する
      # （docs/security/leak-prevention.md の「バージョン更新時」の記述を参照）。
      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      # gitleaks のインストール手順とバージョンは genzouw/ci-workflows の composite action に
      # 集約している。以前はこのワークフローの run ブロックに GITLEAKS_VERSION を直接書いて
      # いたが、同じ値が .github/workflows/gitleaks.yml 経由で呼ぶ ci-workflows 側の
      # reusable workflow にもハードコードされており二重管理になっていた。run ブロック内の値は
      # Dependabot の更新対象外のため同期を保証する仕組みがなく、片方だけ上げると同一リポジトリの
      # 2つのシークレットゲートが別バージョンの gitleaks で走り、ルール追加やパーサ修正の差で
      # 「片方は検知し片方は見逃す」状態が気づかないまま続く（Issue #718）。
      # uses: の SHA ピンは Dependabot (github-actions ecosystem) の更新対象に載るため、
      # バージョン同期が運用ではなく構造で保証される。
      #
      # action 側はダウンロードを $RUNNER_TEMP で行い、tarball と checksums.txt を後始末する。
      # 後続の gitleaks は --no-git で作業ツリー上の全ファイル（未追跡ファイルを含む）を
      # 対象にするため、これらをリポジトリ直下に置くとそれ自体がスキャン対象に入ってしまう。
      - name: Setup gitleaks
        # 参照 SHA は genzouw/ci-workflows#14 のマージコミット（main HEAD）。同日に別PR
        # （完全無料ポリシーworkflow追加）がタグ v1.1.0 / v1.1.1 を先に消費しており、
        # このcomposite action追加分にはまだ専用のリリースタグが無いため、タグではなく
        # main上の実コミットを直接ピンしている。ci-workflows側でこの変更を含む新しい
        # リリースタグが切られたら、そのタグの commit SHA に差し替えること。
        uses: genzouw/ci-workflows/.github/actions/setup-gitleaks@495b912a4b3fe810533654274098528f4ea79510 # genzouw/ci-workflows#14 (main マージ済み、8.30.1)

      # --no-git は PR head の作業ツリーをスキャンします。git モード（履歴スキャン）では
      # 検知行が「そのシークレットを導入したコミット時点のファイル」の行番号として報告され、
      # base..head の差分に対して絞り込む reviewdog の -filter-mode=added とは行番号が
      # 一致しません（後続コミットで前方に行が挿入されると差分側の行番号がずれ、
      # 「追加行ではない」と判定されてアノテーションも -fail-level=any の発火も
      # 静かに失われます）。作業ツリーを直接見れば行番号が head のファイルと一致するため、
      # -filter-mode=added が意図どおりに機能します。
      # 履歴上の既存シークレットの検知は、Push トリガーの gitleaks.yml と週次の定期監査が
      # 担うため、本ワークフローの役割は「このPRが新たに持ち込む差分」への即時フィードバックに
      # 限定しています。
      #
      # --exit-code 0 は「シークレットを検知した」場合の終了コードのみを上書きします
      # （reviewdog 側の filter-mode / fail-level で失敗判定するため）。gitleaks 本体の
      # 設定ファイルのパースエラーなどスキャン自体が異常終了した場合は gitleaks が独自に
      # exit 1 するため、set -euo pipefail によりこのステップは失敗し、旧 action の
      # `gitleaks detect ... || true` のように黙って green になることはありません。
      #
      # --config は "(--source)/.gitleaks.toml" の自動検出より優先されるため明示指定します
      # （旧 action の `gitleaks_config` input は action.yml が受け付けない未定義のinputで
      # 無視されていました）。
      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 0 \
            --report-format sarif \
            --report-path "${RUNNER_TEMP}/gitleaks.sarif"

      - name: Report to PR via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          reviewdog \
            -f=sarif \
            -name=gitleaks \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=any \
            < "${RUNNER_TEMP}/gitleaks.sarif"
