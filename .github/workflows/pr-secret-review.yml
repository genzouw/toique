name: PR Secret Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-secret-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # reviewdog が PR にコメントするために必要

jobs:
  reviewdog-gitleaks:
    name: reviewdog / gitleaks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks requires full history for diff scanning
          persist-credentials: false # このジョブは push を行わないため、資格情報を作業ツリーに残さない

      # action-gitleaks は内部で gitleaks を実行し reviewdog に渡します
      - name: Run Gitleaks with Reviewdog
        uses: reviewdog/action-gitleaks@817639bf2857bdc602310576089a8dffbd2bec13 # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_on_error: true
          # gitleaks の設定ファイル
          gitleaks_config: .gitleaks.toml
