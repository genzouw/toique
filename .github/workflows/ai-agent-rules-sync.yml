name: AI Agent Rules Sync

on:
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日に実行
  workflow_dispatch:

jobs:
  sync_ai_agent_rules:
    name: Sync AI Agent Rules
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run Repomix to pack the repository
        uses: yamadashy/repomix/.github/actions/repomix@c4c80eb8ab3fad8c60f23ff9280f3f2c65789379 # v1.18.0
        with:
          output: repomix-output.xml
          compress: true
          ignore: '**/*.test.ts,**/*.spec.ts,**/dist/**,**/build/**,**/node_modules/**'
          # uses: の SHA は composite action の wrapper だけを固定する。
          # CLI 本体は action 内の `npm install --global repomix@<version>` で入り、
          # 未指定だと default の latest になるため、uses: のバージョンと明示的に揃える。
          repomix-version: '1.18.0'

      - name: Generate AI Agent Rules with GitHub Models
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_FOR_MODELS: ${{ secrets.PAT_FOR_MODELS }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let repoContext = '';
            try {
              repoContext = fs.readFileSync('repomix-output.xml', 'utf8');
            } catch (err) {
              console.error('Failed to read repomix-output.xml', err);
              return;
            }

            const MAX_LENGTH = 100000;
            if (repoContext.length > MAX_LENGTH) {
              repoContext = repoContext.substring(0, MAX_LENGTH) + '\n... (truncated due to length)';
            }

            const schema = {
              type: "object",
              properties: {
                copilot: { type: "string", description: "Rules for GitHub Copilot (.github/copilot-instructions.md)" },
                cursor: { type: "string", description: "Rules for Cursor (.cursorrules)" },
                windsurf: { type: "string", description: "Rules for Windsurf (.windsurfrules)" }
              },
              required: ["copilot", "cursor", "windsurf"],
              additionalProperties: false
            };

            const prompt = `
            あなたはシニアソフトウェアエンジニアです。
            以下のリポジトリ全体のソースコード情報（XML形式）を分析し、各種 AI 開発エディタ (GitHub Copilot, Cursor, Windsurf) 向けのカスタム指示書を作成してください。

            【リポジトリのコンテキスト】
            \`\`\`xml
            ${repoContext}
            \`\`\`

            以下の指示に従ってください：
            1. 使用している主要な言語、フレームワーク（Bun, Hono, React 19, Tailwind CSS 4など）、データベース（PostgreSQL, Drizzle ORM）のコーディング規約を明記してください。
            2. セキュリティ（環境変数の扱いや入力値のサニタイズ）とパフォーマンス（N+1問題の回避など）に関するベストプラクティスを含めてください。
            3. 回答は日本語で出力し、それぞれのエディタに最適化したルールにしてください。
            4. Markdown コードブロックを含めず、そのまま保存できるテキストを含めてください。
            `;

            console.log('Calling GitHub Models for AI Agent Rules Generation...');
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 120000);
            const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.PAT_FOR_MODELS}`
              },
              signal: controller.signal,
              body: JSON.stringify({
                model: 'openai/o3-mini',
                reasoning_effort: "high",
                response_format: {
                  type: "json_schema",
                  json_schema: {
                    name: "ai_agent_rules",
                    schema: schema,
                    strict: true
                  }
                },
                messages: [
                  { role: "developer", content: "You are an expert developer configuring AI assistants. Output strictly JSON matching the schema. Answer in Japanese." },
                  { role: "user", content: prompt }
                ]
              })
            });
            clearTimeout(timeoutId);

            if (!response.ok) {
              const err = await response.text();
              console.error(`GitHub Models API Error: status=${response.status} body=${err}`);
              return;
            }

            const data = await response.json();
            if (data.error) {
              console.error('GitHub Models API Error:', data.error);
              return;
            }
            if (!data.choices || data.choices.length === 0) {
              console.error('GitHub Models API returned no choices:', JSON.stringify(data));
              return;
            }

            const message = data.choices[0].message;
            if (message.refusal) {
              console.error('GitHub Models refused the request:', message.refusal);
              return;
            }

            let result;
            try {
              result = JSON.parse(message.content);
            } catch (err) {
              console.error('Failed to parse GitHub Models response as JSON:', err, message.content);
              return;
            }

            if (!result.copilot || !result.cursor || !result.windsurf) {
              console.error('GitHub Models response missing required fields:', JSON.stringify(result));
              return;
            }

            fs.mkdirSync('.github', { recursive: true });

            fs.writeFileSync('.github/copilot-instructions.md', result.copilot);
            fs.writeFileSync('.cursorrules', result.cursor);
            fs.writeFileSync('.windsurfrules', result.windsurf);
            console.log('Successfully wrote .github/copilot-instructions.md, .cursorrules, and .windsurfrules');

      - name: Create Pull Request with updated AI Agent Rules
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT_FOR_MODELS }}
          commit-message: 'chore: auto-update AI agent rules via AI'
          title: 'chore: AIによるAI Agent Rules (Copilot, Cursor, Windsurf) の自動更新'
          body: '🤖 GitHub Models (o3-mini) によってソースコードから最新の各AIエディタ向けカスタム指示書（Copilot, Cursor, Windsurf）が生成されました。確認してマージしてください。'
          branch: 'ai-agent-rules-update'
          base: 'main'
