name: mutation

# Stryker によるミューテーションテスト (backend/src/lib の一部に限定)。
# 段階導入として必須チェックにはせず、手動実行のみとする。break 閾値は null のため、スコアでは失敗しない。
on:
  workflow_dispatch:
    inputs:
      mutate:
        description: '対象を絞るパス (空なら stryker.config.json の mutate 全体)。例: src/lib/line/signature.ts'
        required: false
        default: ''
        type: string

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation test (backend/src/lib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # bun-version は bun-version-check.yml が全ワークフローで一致を検査する
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run Stryker
        env:
          MUTATE: ${{ inputs.mutate }}
        run: |
          if [ -n "$MUTATE" ]; then
            # --mutate="..." の形で渡し、値が - で始まっても別オプションとして解釈させない
            bun run test:mutation "--mutate=${MUTATE}"
          else
            bun run test:mutation
          fi
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: backend/reports/mutation/mutation.html
          if-no-files-found: error
          retention-days: 14
