name: AI Research Pipeline

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: ai-research-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  research:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # opened: 作成時点で research ラベルが付いている場合のみ。
    # labeled: 付与されたラベル自体が research の場合のみ（他ラベルの追加で再実行しない）。
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'research'))
      || (github.event.action == 'labeled' && github.event.label.name == 'research')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ".github/scripts/ai_research.py"

      - name: Run AI Research Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
        run: uv run .github/scripts/ai_research.py
