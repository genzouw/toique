name: Production smoke test

# デプロイ直後 (deploy.yml から workflow_call) と、デプロイの合間 (schedule) の両方で、
# 本番の API・DB・CORS・CSP・特商法表記を検査する。検査の定義をこのファイルだけに置き、
# デプロイ後と定期実行とで内容がずれないようにする。
on:
  workflow_call:
  schedule:
    # 毎時 0 分は GitHub Actions の混雑で遅延・取りこぼしが起きやすいため、分をずらす。
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # 呼び出し元 (deploy.yml) の workflow レベルの env は再利用可能ワークフローへ引き継がれないため、ここで定義し直す。
  API_DOMAIN: ${{ vars.API_DOMAIN || 'api.toique.genzouw.com' }}
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://toique.genzouw.com' }}

jobs:
  # デプロイが成功扱いでも本番が壊れている状態 (#1076 の CORS 設定漏れ、#233 の CSP 設定漏れ) と、
  # デプロイを伴わない停止 (DB 接続の失効、環境変数や CSP の手作業の変更) を検出する。
  # 検出までが役割で、失敗しても本番は元に戻らない。
  # 戻すときは `gcloud run services update-traffic` で直前のリビジョンへ手で切り替える。
  smoke-test:
    name: Smoke test (production)
    # 呼び出し側のジョブには runs-on を書けないため、呼び出される側に置く。
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # /health は SELECT now() を実行するため、DB 接続の失敗も検出できる。
      # --min-instances=0 のコールドスタートを --retry で吸収する。
      # curl -f は 3xx を失敗にしないため、ステータスが 200 と一致することを確かめる。
      - name: Backend health check
        run: |
          status="$(curl -fsS --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w '%{http_code}' "https://${API_DOMAIN}/health")"
          if [ "$status" != 200 ]; then
            echo "::error::GET https://${API_DOMAIN}/health returned ${status}"
            exit 1
          fi
          echo "OK: /health returned ${status}"

      # backend/src/lib/frontend-origin.ts と同じく、CORS_ORIGIN をカンマで分け、
      # 前後の空白と末尾のスラッシュを除いたものを許可オリジンとして扱う。
      # CORS と CSP の検査対象がずれないよう、正規化はこのステップだけで行い、1 行 1 オリジンで渡す。
      - name: Parse allowed origins
        id: origins
        env:
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          # -d '' で改行を含む値も最後まで読む (read は入力の終端で 1 を返すため || true)。
          IFS=',' read -r -d '' -a origins <<< "$CORS_ORIGIN" || true
          list=''
          for origin in "${origins[@]}"; do
            origin="${origin#"${origin%%[![:space:]]*}"}"
            origin="${origin%"${origin##*[![:space:]]}"}"
            origin="${origin%/}"
            if [ -n "$origin" ]; then
              list+="${origin}"$'\n'
            fi
          done
          # 空のままだと後続の検査が 1 件も行われずに成功するため、ここで止める。
          if [ -z "$list" ]; then
            echo '::error::CORS_ORIGIN has no origin to check'
            exit 1
          fi
          {
            echo 'list<<ORIGINS_EOF'
            printf '%s' "$list"
            echo 'ORIGINS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: CORS preflight for each allowed origin
        env:
          ORIGINS: ${{ steps.origins.outputs.list }}
        run: |
          failed=0
          while IFS= read -r origin; do
            [ -n "$origin" ] || continue
            headers="$(curl -fsS --max-time 30 --retry 3 --retry-all-errors -o /dev/null -D - \
              -X OPTIONS "https://${API_DOMAIN}/api/auth/sign-in/email" \
              -H "Origin: ${origin}" -H 'Access-Control-Request-Method: POST' | tr -d '\r')"
            if ! grep -qixF "access-control-allow-origin: ${origin}" <<< "$headers" \
              || ! grep -qixF 'access-control-allow-credentials: true' <<< "$headers"; then
              echo "::error::CORS preflight from ${origin} is not allowed"
              failed=1
            else
              echo "OK: ${origin}"
            fi
          done <<< "$ORIGINS"
          exit "$failed"

      # 各フロントエンドのオリジンの CSP の connect-src に API のオリジンが含まれることを確かめる。
      # connect-src から漏れると、本番でログインを含む API 呼び出しがすべてブロックされる (#233)。
      - name: Frontend CSP allows the API origin
        env:
          ORIGINS: ${{ steps.origins.outputs.list }}
        run: |
          failed=0
          api_origin="https://${API_DOMAIN}"
          while IFS= read -r origin; do
            [ -n "$origin" ] || continue
            # 取得の失敗と CSP ヘッダの欠落を分けて扱う。curl が途中で失敗しても、
            # 出力済みのヘッダで判定を進めないようにするため。
            if ! headers="$(curl -fsS --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors \
              -o /dev/null -D - "${origin}/")"; then
              echo "::error::Failed to fetch ${origin}/"
              failed=1
              continue
            fi
            csp="$(printf '%s\n' "$headers" | tr -d '\r' | grep -i '^content-security-policy:' || true)"
            if [ -z "$csp" ]; then
              echo "::error::${origin}/ does not return a Content-Security-Policy header"
              failed=1
              continue
            fi
            # connect-src ディレクティブをトークンに分け、API のオリジンと完全一致するものを探す。
            connect_src="$(printf '%s\n' "${csp#*:}" | tr ';' '\n' | grep -i '^[[:space:]]*connect-src[[:space:]]' || true)"
            if printf '%s\n' "$connect_src" | tr -s '[:space:]' '\n' | grep -qxF "$api_origin"; then
              echo "OK: ${origin}"
            else
              echo "::error::connect-src of ${origin} does not include ${api_origin}"
              failed=1
            fi
          done <<< "$ORIGINS"
          exit "$failed"

      # 特商法表記 (frontend/src/pages/Tokushoho.tsx) のプレースホルダが本番の JS に残っていないことを確かめる。
      # 変数を設定してビルドするとプレースホルダは畳み込まれて消え、未設定のときだけエントリーの JS に残る。
      # Frontend のデプロイが止まり古い版が公開され続けている状態 (#1097) も、ここで検出できる。
      # 検査する文字列は Tokushoho.tsx のフォールバック値と揃える。
      - name: Frontend bundle has no Tokushoho placeholders
        run: |
          if ! html="$(curl -fsS --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors "${SITE_ORIGIN}/")"; then
            echo "::error::Failed to fetch ${SITE_ORIGIN}/"
            exit 1
          fi
          scripts="$(printf '%s\n' "$html" | grep -oE '<script[^>]* src="/[^"]+\.js"' | sed -E 's/.* src="([^"]+)"/\1/' || true)"
          # スクリプトが 1 件も見つからないと、検査をせずに成功してしまうため止める。
          if [ -z "$scripts" ]; then
            echo "::error::No script found in ${SITE_ORIGIN}/"
            exit 1
          fi
          failed=0
          # エントリーの JS は数百 KB あるため、変数や here-string に載せず一時ファイル経由で grep に渡す。
          js_file="$(mktemp)"
          while IFS= read -r path; do
            if ! curl -fsS --max-time 30 --retry 3 --retry-all-errors -o "$js_file" "${SITE_ORIGIN}${path}"; then
              echo "::error::Failed to fetch ${SITE_ORIGIN}${path}"
              failed=1
              continue
            fi
            for placeholder in 'Your Company Name' 'Representative Name' 'contact@example.com'; do
              if grep -qF -- "$placeholder" "$js_file"; then
                echo "::error::${SITE_ORIGIN}${path} contains the placeholder '${placeholder}'"
                failed=1
              fi
            done
            echo "Checked: ${path}"
          done <<< "$scripts"
          exit "$failed"
