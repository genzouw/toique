name: Secretlint

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secretlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretlint:
    name: Scan for leaked secrets (Secretlint)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Secretlint
        run: bun run secretlint --format @secretlint/secretlint-formatter-sarif --output secretlint.sarif

      - name: Check Secretlint findings
        run: |
          findings=$(jq '[.runs[].results // []] | flatten | length' secretlint.sarif)
          if [ "$findings" -gt 0 ]; then
            echo "::error::Secretlint detected $findings finding(s). Fix the violations before merging."
            exit 1
          fi

      - name: Upload SARIF to GitHub Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: secretlint.sarif
          category: secretlint
