name: Periodic Secret Scan

on:
  schedule:
    # 毎週月曜 05:00 JST (= 日曜 20:00 UTC) に履歴全体を再スキャン
    - cron: '0 20 * * 0'
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    # 既存の gitleaks.yml と同じ条件（push/pr ではなく定期実行のみ）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: genzouw/ci-workflows/.github/workflows/gitleaks.yml@8769c28e03093662f2012c863156180f08d80f5a # genzouw/ci-workflows#14 (composite action 経由に統一, 8.30.1)
    permissions:
      contents: read
      security-events: write

  trufflehog:
    name: Scan for leaked secrets (TruffleHog)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scan base
        id: scan-base
        uses: ./.github/actions/resolve-scan-base # zizmor: ignore[self-repository]

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          base: ${{ steps.scan-base.outputs.base }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

  secretlint:
    name: Scan for leaked secrets (Secretlint)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Secretlint
        run: bun run secretlint --format @secretlint/secretlint-formatter-sarif --output secretlint.sarif

      - name: Check Secretlint findings
        run: |
          findings=$(jq '[.runs[].results // []] | flatten | length' secretlint.sarif)
          if [ "$findings" -gt 0 ]; then
            echo "::error::Secretlint detected $findings finding(s). Fix the violations before merging."
            exit 1
          fi

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: secretlint.sarif
          category: secretlint

  detect-secrets:
    name: Scan for high-entropy secrets (detect-secrets)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # detect-secrets の YAML パーサは `run:` ブロック全体を1行に平坦化したうえで
      # キーワード検出を行うため、ブロック中に `detect-secrets==1.5.0` と直書きすると
      # `secrets=` の直後の値が「Secret Keyword」として誤検知される
      # (pr-detect-secrets-review.yml の同種コメント参照)。バージョンを env の
      # DS_VERSION に切り出して `${DS_VERSION}` 参照にすると誤検知が消える。
      - name: Install detect-secrets
        env:
          DS_VERSION: '1.5.0'
        run: |
          set -euo pipefail
          export UV_TOOL_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$UV_TOOL_BIN_DIR"
          uv tool install "detect-secrets==${DS_VERSION}"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Resolve scan base
        id: scan-base
        uses: ./.github/actions/resolve-scan-base # zizmor: ignore[self-repository]

      - name: Run detect-secrets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ''
          PUSH_CURRENT_SHA: ${{ github.sha }}
          SCAN_BASE: ${{ steps.scan-base.outputs.base }}
        run: |
          set -euo pipefail

          cp .secrets.baseline /tmp/baseline_reference.json
          ORIGINAL_SHA="$(git rev-parse HEAD)"

          scan_tree() {
            detect-secrets scan --exclude-files '^\.secrets\.baseline$' -n \
              > /tmp/scan_result.json

            to_keys() {
              jq -S '[.results | to_entries[] | .key as $file | .value[] | {file: $file, hashed_secret, type}] | sort' "$1"
            }
            to_keys /tmp/baseline_reference.json > /tmp/baseline_keys.json
            to_keys /tmp/scan_result.json > /tmp/scan_keys.json

            NEW_SECRETS="$(jq -n --slurpfile baseline /tmp/baseline_keys.json --slurpfile scan /tmp/scan_keys.json '$scan[0] - $baseline[0]')"
            if [ "$NEW_SECRETS" != "[]" ]; then
              echo "New secrets not present in baseline:"
              echo "$NEW_SECRETS"
              return 1
            fi
            return 0
          }

          if ! scan_tree; then
            echo "::error::🚨 [Security Error] detect-secrets detected new high-entropy secrets that are not in the baseline."
            echo "Please remove the secrets from your code. If they are false positives, update the baseline locally by running 'bun run detect-secrets:update' and commit the updated '.secrets.baseline'."
            exit 1
          fi
          echo "✅ No new secrets detected."
