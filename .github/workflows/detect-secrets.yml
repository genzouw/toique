name: Detect-Secrets

on:
  push:
  pull_request:
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC) に実行
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: detect-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Scan for high-entropy secrets (detect-secrets)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push / pull_request 時に対象コミット範囲を git rev-list で辿るには全履歴が必要
          # (forbidden-paths.yml と同じ理由)。
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install detect-secrets
        # `uv pip install --system` はランナーのシステム Python の dist-packages
        # (/usr/local/lib/python3.12/dist-packages) へ書き込もうとするが、非 root の
        # runner ユーザーには書き込み権限がなく Permission denied で失敗する
        # (--break-system-packages は PEP 668 の拒否を解除するだけで、権限不足は解消しない)。
        # sudo でシステム Python を汚す代わりに、専用の隔離環境へ導入する
        # `uv tool install` を使い、実行ファイルのあるディレクトリを PATH へ追加する。
        # 導入先は ~/.local (リポジトリ外) のため、後続の detect-secrets scan の
        # 走査対象にも含まれない。
        run: |
          set -euo pipefail
          export UV_TOOL_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$UV_TOOL_BIN_DIR"
          uv tool install detect-secrets==1.5.0
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Resolve scan base
        id: scan-base
        # 到達性ガードの実装は composite action に一本化している。詳細は
        # .github/actions/resolve-scan-base/action.yml を参照。
        uses: ./.github/actions/resolve-scan-base

      - name: Run detect-secrets
        env:
          # `${{ }}` を run ブロック内に直接展開するとシェルへのコード注入経路になる
          # (zizmor template-injection)。env 経由で渡し、シェル変数として参照する。
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_CURRENT_SHA: ${{ github.sha }}
          SCAN_BASE: ${{ steps.scan-base.outputs.base }}
        run: |
          set -euo pipefail

          # 「既知として許容する秘密の一覧」は常に現在の HEAD の .secrets.baseline を
          # 正とする。範囲内の過去コミットへ checkout してもこの参照は変えないよう、
          # コミット済みファイルを固定パスへ複製してから使う。
          cp .secrets.baseline /tmp/baseline_reference.json
          ORIGINAL_SHA="$(git rev-parse HEAD)"

          scan_tree() {
            # コミット済みの .secrets.baseline 自体は書き換えない。
            # detect-secrets はスキャンの度に generated_at を現在時刻で更新するため、
            # ファイル全体を素朴に git diff すると新しいシークレットが無くても
            # 常に差分が出て CI が失敗し続けてしまう（実機検証済み）。
            # そのためスキャン結果は別ファイルに出力し、後段で results のみを比較する。
            #
            # --baseline には PR 側で改変可能な .secrets.baseline を絶対に渡さない
            # (CWE-94: Improper Control of Generation of Code)。detect-secrets は
            # `scan --baseline <file>` 実行時に <file> の filters_used をそのまま
            # スキャン設定として読み込み、file:// スキームのフィルタが指定されて
            # いれば importlib 経由でそのファイルの Python コードを実行してしまう
            # (detect_secrets/util/importlib.py の import_file_as_module、ソース内の
            # 自己申告どおり "we're essentially executing arbitrary code here" が該当)。
            # --force-use-all-plugins は plugins_used のみをリセットし filters_used
            # には一切効果がないため（detect_secrets/core/usage/scan.py で実機確認済み）、
            # baseline を渡す限りこの経路は塞げない。フォーク PR はこのリポジトリの
            # .secrets.baseline を自由に書き換えられるため、baseline ファイルは常に
            # 「スキャン結果と比較するための信頼できないデータ」としてのみ扱い、
            # スキャン自体は --baseline を渡さない固定設定（既定で有効になる組み込み
            # 全プラグイン、追加フィルタなし）で実行する。既知シークレットの許可
            # リストが必要な場合も、PR base SHA など信頼済みの baseline のみを使うこと。
            # --exclude-files: baseline を渡さないスキャンは既定でカレントディレクトリ
            # 以下（.secrets.baseline を含む）を対象にするため、ファイル内のハッシュ値が
            # 高エントロピー文字列として誤検知される。baseline 側の設定に依存しないよう
            # ワークフロー側で明示的に除外する。
            # -n/--no-verify: 検知候補の追加検証のための外部API呼び出しを無効化し、
            # フォークPRのコード内容が外部へ送信されることを防ぐ。
            #
            # --baseline を渡さない場合、detect-secrets はスキャン結果を標準出力へ
            # JSON で出力する（ファイルを書き換えない）ため、そのままファイルへ
            # リダイレクトして保持する。
            detect-secrets scan --exclude-files '^\.secrets\.baseline$' -n \
              > /tmp/scan_result.json

            # 判定は「スキャン結果に存在するが baseline に無いシークレット」の有無のみで行う
            # （filename + hashed_secret + type をキーとした片方向の差集合）。
            # baseline にだけ存在するエントリは無視してよい。range 内の途中コミットの
            # ツリーには、現在の HEAD で baseline 登録済みのファイルがまだ存在しない
            # ことがあり（例: feature ブランチでのみ追加されたワークフローファイル）、
            # その場合スキャン結果に対応エントリが出ないのは新規シークレットではなく
            # 正常な差分である。generated_at 等のメタ情報や is_verified（baseline は
            # ローカルの `detect-secrets:update` でネットワーク検証済み、CI のスキャンは
            # -n で検証を常に無効化するため構造的に一致しない）も、キーに含めないことで
            # 比較対象から自然に除外される。
            to_keys() {
              jq -S '[.results | to_entries[] | .key as $file | .value[] | {file: $file, hashed_secret, type}] | sort' "$1"
            }
            to_keys /tmp/baseline_reference.json > /tmp/baseline_keys.json
            to_keys /tmp/scan_result.json > /tmp/scan_keys.json

            NEW_SECRETS="$(jq -n --slurpfile baseline /tmp/baseline_keys.json --slurpfile scan /tmp/scan_keys.json '$scan[0] - $baseline[0]')"
            if [ "$NEW_SECRETS" != "[]" ]; then
              echo "New secrets not present in baseline:"
              echo "$NEW_SECRETS"
              return 1
            fi
            return 0
          }

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            # 最終コミットのツリーだけをスキャンするスナップショット方式だと、range 内の
            # 途中コミットで追加され、後続のコミットで削除された秘密情報を検知できない。
            # それでも当該秘密は git 履歴上に残ったままプッシュ済みのため、公開リポジトリ
            # では漏洩とみなす必要がある (forbidden-paths.yml が .husky/pre-push と同じ
            # 理由で行っている範囲検査と同様の考え方)。そのため range 内の全コミットの
            # ツリーを個別にスキャンする。
            # pull_request では merge commit である github.sha ではなく PR の head を終点にする。
            if [ "$EVENT_NAME" = "pull_request" ]; then
              HEAD_SHA="$PR_HEAD_SHA"
            else
              HEAD_SHA="$PUSH_CURRENT_SHA"
            fi

            # SCAN_BASE は Resolve scan base ステップ（composite action）の出力。
            # 空文字は「起点にできる直前コミットが無い」ことを意味する。
            if [ -n "$SCAN_BASE" ]; then
              echo "コミット範囲 ($SCAN_BASE..$HEAD_SHA) を検査します..."
              if ! COMMITS="$(git rev-list "$SCAN_BASE".."$HEAD_SHA")"; then
                echo "::error::Unable to inspect the complete commit range ($SCAN_BASE..$HEAD_SHA). Failing closed instead of falling back to a partial check."
                exit 1
              fi
            else
              # 新規ブランチの push の場合は before が all zero SHA になる。また force-push
              # （dependabot の rebase 等）では旧 HEAD が孤児化して到達不能になり、before の
              # 実体がリポジトリに存在しなくなるため `git rev-list BEFORE..CURRENT` が必ず失敗する。
              # いずれの場合もデフォルトブランチとの差分となる履歴を検査することで、途中で
              # 追加後に削除されたシークレットも見逃さないようにする。force-push 後は旧コミット
              # が GitHub 上からも到達不能となるため、この経路は現存するブランチの実体に対する
              # 完全な検査であり fail closed の設計意図を損なわない。
              echo "新規ブランチの push、before SHA が空、または before SHA が到達不能（force-push）を検知しました。origin/$DEFAULT_BRANCH との差分となるコミット履歴を検査します..."
              if ! COMMITS="$(git rev-list "$HEAD_SHA" --not "origin/$DEFAULT_BRANCH")"; then
                echo "::error::Unable to inspect the complete commit history (against origin/$DEFAULT_BRANCH). Failing closed instead of falling back to a partial check."
                exit 1
              fi
            fi

            if [ -z "$COMMITS" ]; then
              echo "No commits to scan."
              exit 0
            fi

            FAILED=0
            for sha in $COMMITS; do
              echo "--- Scanning tree at $sha ---"
              git checkout --quiet --detach "$sha"
              if ! scan_tree; then
                echo "::error::🚨 [Security Error] detect-secrets detected high-entropy secrets at commit $sha that are not in the baseline."
                FAILED=1
              fi
            done
            # 元のコミットへ戻す（後続ステップやキャッシュへの影響を避けるため）
            git checkout --quiet "$ORIGINAL_SHA"

            if [ "$FAILED" -ne 0 ]; then
              echo "Please remove the secrets from your code. If they are false positives, update the baseline locally by running 'bun run detect-secrets:update' and commit the updated '.secrets.baseline'."
              exit 1
            fi
            echo "✅ No new secrets detected in the commit range."
          else
            # schedule / workflow_dispatch: 定期実行は「現状の HEAD が健全か」の確認が
            # 目的であり、過去のコミット範囲は対象外（gitleaks.yml / trufflehog.yml の
            # 「schedule 時は履歴全体を対象にした snapshot 再スキャン」という設計と整合）。
            if ! scan_tree; then
              echo "::error::🚨 [Security Error] detect-secrets detected new high-entropy secrets that are not in the baseline."
              echo "Please remove the secrets from your code. If they are false positives, update the baseline locally by running 'bun run detect-secrets:update' and commit the updated '.secrets.baseline'."
              exit 1
            fi
            echo "✅ No new secrets detected."
          fi
