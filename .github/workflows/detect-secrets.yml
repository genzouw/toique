name: Detect-Secrets

on:
  push:
  pull_request:
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC) に実行
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: detect-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Scan for high-entropy secrets (detect-secrets)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push / pull_request 時に対象コミット範囲を git rev-list で辿るには全履歴が必要
          # (forbidden-paths.yml と同じ理由)。
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0

      - name: Install detect-secrets
        # ランナーの Python 3.12 は externally-managed-environment (PEP 668) のため、
        # --system 単独では `uv pip install` が拒否される。CI の使い捨て環境であり
        # システム Python を汚しても問題ないため --break-system-packages で明示的に許可する。
        run: uv pip install --system --break-system-packages detect-secrets==1.5.0

      - name: Run detect-secrets
        env:
          # `${{ }}` を run ブロック内に直接展開するとシェルへのコード注入経路になる
          # (zizmor template-injection)。env 経由で渡し、シェル変数として参照する。
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 「既知として許容する秘密の一覧」は常に現在の HEAD の .secrets.baseline を
          # 正とする。範囲内の過去コミットへ checkout してもこの参照は変えないよう、
          # コミット済みファイルを固定パスへ複製してから使う。
          cp .secrets.baseline /tmp/baseline_reference.json
          ORIGINAL_SHA="$(git rev-parse HEAD)"

          scan_tree() {
            # コミット済みの .secrets.baseline 自体は書き換えない。
            # detect-secrets はスキャンの度に generated_at を現在時刻で更新するため、
            # ファイル全体を素朴に git diff すると新しいシークレットが無くても
            # 常に差分が出て CI が失敗し続けてしまう（実機検証済み）。
            # そのためスキャン結果は別ファイルに出力し、後段で results のみを比較する。
            #
            # --force-use-all-plugins: .secrets.baseline の plugins_used / filters_used は
            # このワークフローが --baseline 経由でそのままスキャン設定として読み込む。
            # PR 側で改変できるこのファイルの設定を信頼すると、検知器を無効化・弱体化して
            # 混入したシークレットの検知を回避できてしまう（実機検証済み: 例えば
            # plugins_used から AWSKeyDetector を除去すると AWS キーが検知されなくなる）。
            # 常に全プラグインで検知することでこの回避経路を塞ぐ。なお、このフラグは
            # baseline の filters_used も無効化し、.secrets.baseline 自身をスキャン対象に
            # 含めてしまう（ファイル内のハッシュ値が高エントロピー文字列として誤検知される）
            # ため、--exclude-files で明示的に除外する（baseline 側の設定に依存しないよう、
            # ワークフロー側で固定する）。
            # -n/--no-verify: 検知候補の追加検証のための外部API呼び出しを無効化し、
            # フォークPRのコード内容が外部へ送信されることを防ぐ。
            #
            # detect-secrets scan --baseline <file> は <file> を直接書き換える
            # （標準出力には結果を出さない）。/tmp/baseline_reference.json を直接
            # 渡すと参照用のコピーそのものが書き換わってしまうため、都度使い捨ての
            # コピーへスキャン結果を書かせ、参照用ファイルとは別に保持する。
            cp /tmp/baseline_reference.json /tmp/scan_result.json
            detect-secrets scan --baseline /tmp/scan_result.json --force-use-all-plugins \
              --exclude-files '^\.secrets\.baseline$' -n

            # generated_at 等のメタ情報の差異は無視し、実際の検知結果（results）のみを比較する。
            diff -u <(jq -S '.results' /tmp/baseline_reference.json) <(jq -S '.results' /tmp/scan_result.json)
          }

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            # 最終コミットのツリーだけをスキャンするスナップショット方式だと、range 内の
            # 途中コミットで追加され、後続のコミットで削除された秘密情報を検知できない。
            # それでも当該秘密は git 履歴上に残ったままプッシュ済みのため、公開リポジトリ
            # では漏洩とみなす必要がある (forbidden-paths.yml が .husky/pre-push と同じ
            # 理由で行っている範囲検査と同様の考え方)。そのため range 内の全コミットの
            # ツリーを個別にスキャンする。
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "Scanning commits in PR range ($PR_BASE_SHA..$PR_HEAD_SHA)..."
              if ! COMMITS="$(git rev-list "$PR_BASE_SHA".."$PR_HEAD_SHA")"; then
                echo "::error::Unable to inspect the complete commit range ($PR_BASE_SHA..$PR_HEAD_SHA). Failing closed instead of falling back to a partial check."
                exit 1
              fi
            elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$PUSH_BEFORE_SHA" ]; then
              # 新規ブランチの push の場合は before が all zero SHA になる。デフォルト
              # ブランチとの差分となる履歴を検査することで、途中で追加後に削除された
              # シークレットも見逃さないようにする。
              echo "New branch push detected or before SHA is empty. Scanning commit history since origin/$DEFAULT_BRANCH..."
              if ! COMMITS="$(git rev-list "$PUSH_CURRENT_SHA" --not "origin/$DEFAULT_BRANCH")"; then
                echo "::error::Unable to inspect the complete commit history (against origin/$DEFAULT_BRANCH). Failing closed instead of falling back to a partial check."
                exit 1
              fi
            else
              echo "Scanning commits in push range ($PUSH_BEFORE_SHA..$PUSH_CURRENT_SHA)..."
              if ! COMMITS="$(git rev-list "$PUSH_BEFORE_SHA".."$PUSH_CURRENT_SHA")"; then
                echo "::error::Unable to inspect the complete commit range ($PUSH_BEFORE_SHA..$PUSH_CURRENT_SHA). Failing closed instead of falling back to a partial check."
                exit 1
              fi
            fi

            if [ -z "$COMMITS" ]; then
              echo "No commits to scan."
              exit 0
            fi

            FAILED=0
            for sha in $COMMITS; do
              echo "--- Scanning tree at $sha ---"
              git checkout --quiet --detach "$sha"
              if ! scan_tree; then
                echo "::error::🚨 [Security Error] detect-secrets detected high-entropy secrets at commit $sha that are not in the baseline."
                FAILED=1
              fi
            done
            # 元のコミットへ戻す（後続ステップやキャッシュへの影響を避けるため）
            git checkout --quiet "$ORIGINAL_SHA"

            if [ "$FAILED" -ne 0 ]; then
              echo "Please remove the secrets from your code. If they are false positives, update the baseline locally by running 'bun run detect-secrets:update' and commit the updated '.secrets.baseline'."
              exit 1
            fi
            echo "✅ No new secrets detected in the commit range."
          else
            # schedule / workflow_dispatch: 定期実行は「現状の HEAD が健全か」の確認が
            # 目的であり、過去のコミット範囲は対象外（gitleaks.yml / trufflehog.yml の
            # 「schedule 時は履歴全体を対象にした snapshot 再スキャン」という設計と整合）。
            if ! scan_tree; then
              echo "::error::🚨 [Security Error] detect-secrets detected new high-entropy secrets that are not in the baseline."
              echo "Please remove the secrets from your code. If they are false positives, update the baseline locally by running 'bun run detect-secrets:update' and commit the updated '.secrets.baseline'."
              exit 1
            fi
            echo "✅ No new secrets detected."
          fi
