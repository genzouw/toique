name: AI Issue Triage (Local Ollama)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    name: Run AI Issue Triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install and Start Ollama
        env:
          OLLAMA_VERSION: v0.34.4
          # SHA-256 of ollama-linux-amd64.tar.zst for OLLAMA_VERSION above, taken from
          # https://github.com/ollama/ollama/releases/download/v0.34.4/sha256sum.txt.
          # This must be updated together with OLLAMA_VERSION when bumping the version,
          # so the checksum comes from a source independent of the release artifact
          # being verified (a compromised release can't rewrite this file at runtime).
          OLLAMA_TARBALL_SHA256: c238986e61d40c0cc5f4a9b9e40b9eea104350b77efa34741fc134e105cb9533 # pragma: allowlist secret
        run: |
          set -euo pipefail
          TARBALL="ollama-linux-amd64.tar.zst"
          curl -fsSL -o "$TARBALL" "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/${TARBALL}"
          echo "${OLLAMA_TARBALL_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar --zstd -C /usr/local -xf "$TARBALL"
          rm -f "$TARBALL"
          ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Ollama server did not become ready within 30s" >&2
              exit 1
            fi
            sleep 1
          done
          ollama pull deepseek-r1:1.5b

      - name: Run Issue Triage script
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          uv run .github/scripts/issue-triage.py

          if [ -f issue_research.md ]; then
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh issue comment "${{ github.event.issue.number }}" --body-file issue_research.md
          fi

          rm -f issue_research.md
