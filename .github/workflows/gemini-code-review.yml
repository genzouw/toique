name: Gemini Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: petarzarkov/gemini-code-review-action@e8e786b3b05e3bb3139072f05ae6c1ad9cba3027
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            あなたは優秀なソフトウェアエンジニアです。与えられたコードの変更点をレビューし、潜在的なバグ、セキュリティの問題、パフォーマンスの改善点、または一般的なコード品質の向上について提案を行ってください。
            コメントはすべて日本語のMarkdownで記述し、分かりやすく構成してください。
