name: Repomix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  repomix:
    name: Repomix でリポジトリをパックする
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js のセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Repomix でリポジトリをパックする
        # AIフレンドリーな形式（XML）でリポジトリ全体を1つのファイルにまとめる
        # 注: リポジトリの Actions 設定 (selected actions) が個人アカウント提供の
        # yamadashy/repomix Composite Action を許可していないため startup_failure が発生する。
        # 許可済みの github-owned アクション (actions/setup-node) + npm 経由での直接実行に切り替える。
        # バージョンは zizmor (adhoc-packages) 対策として latest ではなく固定値を指定する。
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # PR の差分が些細（20 文字未満かつ 3 行未満）な場合だけスキップする。
          # 差分を取得できない場合・バイナリを含む場合は、スキップせず通常実行へ進める。
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if numstat=$(git diff --numstat "origin/${BASE_REF}...HEAD") \
              && counts=$(git diff -U0 "origin/${BASE_REF}...HEAD" | awk '
                /^(\+\+\+|---) / { next }
                /^[+-]/ { lines++; chars += length(substr($0, 2)) }
                END { print lines + 0, chars + 0 }'); then
              read -r changedLineCount changedCharCount <<< "$counts"
              if [ -n "$numstat" ] && ! printf '%s\n' "$numstat" | grep -q '^-' \
                && [ "$changedCharCount" -lt 20 ] && [ "$changedLineCount" -lt 3 ]; then
                echo "PR diff is trivial. Skipping repomix execution to optimize API quotas."
                echo "skip=true" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
          fi
          npm install --global repomix@1.18.1
          repomix --config repomix.config.json

      - name: Repomix 出力アーティファクトのアップロード
        # 生成されたXMLファイルを、AIツールなどで後から利用できるように保存
        if: env.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repomix-output
          path: repomix-output.xml
          retention-days: 30
