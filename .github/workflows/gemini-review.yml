name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # For security reasons with fork PRs, avoid auto-running on forks if possible,
    # but the action itself should handle it or we limit the trigger.

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Skip for fork PRs to prevent secret leakage, as PR reviews on forks need pull_request_target,
    # but for simplicity we restrict to internal PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini PR Review
        uses: derailed-dash/gemini-review-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-1.5-pro"
          language: "ja"
