name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # To prevent fork PRs from duplicating runs internally, use the condition below in jobs.
    # Note: Using 'push' on branches: ['*'] is required for some scanners, but for reviews we use pull_request.

jobs:
  gemini_review:
    name: Gemini PR Code Review
    # Only run on internal PRs or pushed PRs from forks that are executed in the fork context
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini Code Review
        uses: derailed-dash/gemini-review-action@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: 'Japanese'
