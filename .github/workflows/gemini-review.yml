name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # pull_request: フォーク/Dependabot PRにはGEMINI_API_KEYが渡らないため同一リポジトリかつ非Dependabot PRのみ自動実行
    # issue_comment: PRに対するコメントのうち、本文が完全一致で `/gemini-review` かつ
    #   コメント投稿者の author_association が OWNER/MEMBER/COLLABORATOR（＝リポジトリへの書込み権限を持つ信頼できる人物）
    #   の場合のみ実行（フォークPRでも権限者の明示コマンドで起動可能）。任意のコメントで
    #   secrets付き特権ジョブが起動しないよう、起動条件をコマンド＋権限者に限定する。
    # 両イベントともDependabot作成PRは対象外（自動化されたPRにAIレビューを起動する意図はないため）。
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.user.login != 'dependabot[bot]' &&
       github.event.comment.body == '/gemini-review' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # issue_comment 起動時は github.event.pull_request が無く、対象PRがフォーク由来かを
      # YAML式だけでは判定できない。gh CLI で isCrossRepository を確認し、フォークPRであれば
      # 後続のcheckout（未信頼コードの取得）とレビュー実行自体をスキップする。
      # secrets を持つ特権ジョブで未信頼コードをcheckoutしない（pwn request対策）ため。
      - name: Determine PR origin for comment-triggered review
        id: pr_origin
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_JSON=$(gh pr view "${{ github.event.issue.number }}" --json isCrossRepository,headRefOid)
          IS_FORK=$(echo "$PR_JSON" | jq -r '.isCrossRepository')
          PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          echo "is_fork=$IS_FORK" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$IS_FORK" = "true" ]; then
            echo "::warning::フォーク由来のPRのため、未信頼コードのチェックアウトを避けてレビューをスキップします。"
          fi

      - name: Checkout repository
        if: github.event_name == 'pull_request' || steps.pr_origin.outputs.is_fork == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || steps.pr_origin.outputs.pr_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gemini PR Review
        if: github.event_name == 'pull_request' || steps.pr_origin.outputs.is_fork == 'false'
        uses: derailed-dash/gemini-review-action@588dce6c72ea61e3a3b306b5648361de450179ab
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          command: 'review'
          language: 'Japanese'
