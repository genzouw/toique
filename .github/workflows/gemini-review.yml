name: Gemini AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    # 公開リポジトリで第三者が GEMINI_API_KEY を消費しないよう、
    # 信頼できる author_association のみ実行可能にする。
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gemini AI Review
        uses: derailed-dash/gemini-review-action@aaf0094c47ba7cd10a2fc05c0db5b3d29b2582f9 # v1.5.1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_model: 'gemini-1.5-pro'
          language: 'Japanese'
