name: '🤖 Gemini Code Review & Triage'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/gemini-review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0

      - name: Get PR details
        id: pr_details
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prDiff=$(gh pr view ${{ github.event.pull_request.number }} --json additions,deletions -q '.additions + .deletions')
          changedFiles=$(gh pr view ${{ github.event.pull_request.number }} --json changedFiles -q '.changedFiles | length')

          echo "diff_size=$prDiff" >> $GITHUB_OUTPUT
          echo "changed_files=$changedFiles" >> $GITHUB_OUTPUT

      - name: Run Gemini Review Action
        if: |
          github.event_name == 'issue_comment' ||
          (github.event_name == 'pull_request' && steps.pr_details.outputs.diff_size >= 20 && steps.pr_details.outputs.changed_files >= 1)
        uses: petarzarkov/gemini-code-review-action@db0558aaebc97373346194ed926bef6b15962512
        with:
          model: 'gemini-1.5-pro'
          language: 'ja'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
