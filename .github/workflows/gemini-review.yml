name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # フォークPRでの重複実行を防ぐため、実際の制御は下記ジョブの if 条件で行う。
    # 一部のスキャナでは push トリガー（branches: ['*']）が必要になることがあるが、
    # レビュー用途では pull_request トリガーを使用する。

jobs:
  gemini_review:
    name: Gemini PR Code Review
    concurrency:
      group: gemini-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # 同一リポジトリ内のPRのみ実行する（フォークPRでは実行しない）
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gemini Code Review
        uses: derailed-dash/gemini-review-action@aaf0094c47ba7cd10a2fc05c0db5b3d29b2582f9 # v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: 'Japanese'
