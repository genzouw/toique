name: lychee

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.html'
      - 'lychee.toml'
      - '.github/workflows/lychee.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.html'
      - 'lychee.toml'
      - '.github/workflows/lychee.yml'
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC)。リンク切れはコミットと無関係に発生するため定期実行する
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: lychee-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    uses: genzouw/ci-workflows/.github/workflows/lychee.yml@b6a71471033888f2d8c59b882e4659f1f1121d18 # v1.5.8
