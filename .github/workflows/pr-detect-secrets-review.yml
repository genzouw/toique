name: PR Detect-Secrets Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-detect-secrets-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # reviewdog が PR にコメントするために必要

jobs:
  reviewdog-detect-secrets:
    name: reviewdog / detect-secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install detect-secrets
        run: |
          set -euo pipefail
          export UV_TOOL_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$UV_TOOL_BIN_DIR"
          uv tool install detect-secrets==1.5.0
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      # detect-secrets scan を実行し、見つかった場合は reviewdog に渡せるように rdjson フォーマットに変換する。
      # detect-secrets 自体は baseline に無いシークレットを標準出力に JSON 形式で出力する。
      - name: Run detect-secrets and report via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # `--baseline` を渡さず、カレントディレクトリ以下のすべてを対象にスキャンする。
          # ただし `.secrets.baseline` 自身は除外する。
          detect-secrets scan --exclude-files '^\.secrets\.baseline$' -n > "${RUNNER_TEMP}/detect-secrets.json" || true

          # detect-secrets の出力 (JSON) を jq で rdjson (Reviewdog Diagnostic JSON) に変換する
          cat "${RUNNER_TEMP}/detect-secrets.json" | jq -r '
            {
              source: {
                name: "detect-secrets",
                url: "https://github.com/Yelp/detect-secrets"
              },
              diagnostics: [
                .results | to_entries[] | .key as $file | .value[] | {
                  message: ("High-entropy secret detected: " + .type),
                  location: {
                    path: $file,
                    range: {
                      start: {
                        line: .line_number
                      }
                    }
                  },
                  severity: "ERROR"
                }
              ]
            }
          ' > "${RUNNER_TEMP}/detect-secrets.rdjson"

          reviewdog \
            -f=rdjson \
            -name=detect-secrets \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=any \
            < "${RUNNER_TEMP}/detect-secrets.rdjson"
