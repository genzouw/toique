name: PR Detect-Secrets Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-detect-secrets-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # reviewdog が PR にコメントするために必要

jobs:
  reviewdog-detect-secrets:
    name: reviewdog / detect-secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # detect-secrets の YAML パーサは `run:` ブロック全体を1行に平坦化したうえで
      # キーワード検出を行うため、ブロック中に `detect-secrets==1.5.0` と直書きすると
      # `secrets=` の直後の値が「Secret Keyword」として誤検知される（本ファイル自身が
      # 本ワークフローで毎回検知される自己参照の原因だった）。バージョンを `env` の
      # DS_VERSION に切り出して `${DS_VERSION}` 参照にすると、detect-secrets の
      # is_templated_secret フィルタがテンプレート値として除外するため誤検知が消える。
      # 変数名に secret / token 等のキーワードを含めないこと（含めると env 側が検知される）。
      - name: Install detect-secrets
        env:
          DS_VERSION: '1.5.0'
        run: |
          set -euo pipefail
          export UV_TOOL_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$UV_TOOL_BIN_DIR"
          uv tool install "detect-secrets==${DS_VERSION}"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      # PR checkout の `.secrets.baseline` は same-repository PR の作成者が自由に書き換えられる
      # ため、比較対象として信頼できない (CWE-693)。作成者が自分の混入させたシークレットと
      # 一致する filename + hashed_secret + type のエントリを追加すれば、後段の jq 比較で
      # 検知結果を握りつぶせてしまう。そのため比較用の baseline は常に PR のベースブランチ
      # (信頼済みリビジョン) から取得し、PR 側の変更を一切反映しない固定データとして扱う。
      - name: Fetch trusted baseline from PR base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # 浅い checkout (fetch-depth: 1) のままでは base SHA のコミットオブジェクトが
          # ローカルに存在しないため、比較に必要なそのコミットだけを追加で取得する。
          git fetch --depth=1 origin "$PR_BASE_SHA"
          git show "$PR_BASE_SHA:.secrets.baseline" > "${RUNNER_TEMP}/trusted-baseline.json"

      - name: Place detect-secrets diff filter
        id: diff-filter
        # baseline との比較ロジックは composite action に一本化している。詳細は
        # .github/actions/detect-secrets-diff/new-secrets.jq を参照。
        uses: ./.github/actions/detect-secrets-diff # zizmor: ignore[self-repository]

      # detect-secrets scan を実行し、`.secrets.baseline` に未登録の新規シークレットのみを
      # reviewdog に渡せるように rdjson フォーマットに変換する。
      #
      # `--baseline` フラグは意図的に使わない。detect-secrets は `scan --baseline <file>`
      # 実行時に <file> の filters_used をそのままスキャン設定として読み込み、file:// スキームの
      # フィルタが指定されていれば任意コードを実行してしまう (CWE-94、detect-secrets.yml の
      # 同種コメント参照)。そのため baseline は常に「スキャン結果と比較するための静的な JSON
      # データ」としてのみ扱い、jq でのキー比較 (filename + hashed_secret + type) によって
      # 登録済みシークレットを除外する。
      - name: Run detect-secrets and report via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER: ${{ steps.diff-filter.outputs.filter }}
        run: |
          set -euo pipefail

          # `--baseline` を渡さず、カレントディレクトリ以下のすべてを対象にスキャンする。
          # ただし `.secrets.baseline` 自身は、記録している hashed_secret の16進文字列が
          # 新規シークレットとして再検出されてしまうため除外する。
          EXCLUDE_PATTERN='(^\.secrets\.baseline$)'

          # `detect-secrets scan` は検知の有無にかかわらず exit 0 を返すため、`|| true` で
          # 吸収されるのはプラグインの例外やファイル読み取り失敗といった本物の異常だけに
          # なる。`detect-secrets.yml` / `pr-secret-review.yml` と同様、スキャン自体が
          # 異常終了した場合は `set -euo pipefail` によってこのステップを失敗させる。
          detect-secrets scan \
            --exclude-files "$EXCLUDE_PATTERN" \
            -n > "${RUNNER_TEMP}/detect-secrets.json"

          # baseline に無い検知（= 新規シークレット）だけを残す。比較キーは
          # filename + hashed_secret + type (new-secrets.jq 参照)。reviewdog の位置情報に
          # 使うため line_number を出力に含める (--argjson line true)。
          #
          # 許可リストは直前のステップで取得したベースブランチ由来の baseline のみを信頼する。
          # PR checkout 側のファイル（`.secrets.baseline` や独自の例外ファイル）を許可リストへ
          # 合流させると、書き込み権限を持つPR作成者が自分の混入させたシークレットと同じ
          # filename + hashed_secret + type を追加するだけで検知を握りつぶせてしまう
          # （CWE-693: Protection Mechanism Failure）。新たな例外が必要になった場合は、
          # まずベースブランチの `.secrets.baseline` へ登録してから取り込むこと。
          jq -S \
            --slurpfile baseline "${RUNNER_TEMP}/trusted-baseline.json" \
            --argjson line true \
            -f "$FILTER" \
            "${RUNNER_TEMP}/detect-secrets.json" > "${RUNNER_TEMP}/new-secrets.json"

          # 新規シークレットの一覧 (JSON) を jq で rdjson (Reviewdog Diagnostic JSON) に変換する
          jq -r '
            {
              source: {
                name: "detect-secrets",
                url: "https://github.com/Yelp/detect-secrets"
              },
              diagnostics: [
                .[] | {
                  message: ("High-entropy secret detected: " + .type),
                  location: {
                    path: .file,
                    range: {
                      start: {
                        line: .line_number
                      }
                    }
                  },
                  severity: "ERROR"
                }
              ]
            }
          ' "${RUNNER_TEMP}/new-secrets.json" > "${RUNNER_TEMP}/detect-secrets.rdjson"

          # reviewdog は「置ける場所にはアノテーションを置く」ベストエフォート役に限定し、
          # ジョブの合否判定は担わせない (`-fail-level=any` を付けない)。
          # detect-secrets の YAML トランスフォーマは `run:` ブロックを平坦化して評価し、
          # 検知行としてブロック内の実際の行ではなく `run:` キーの行番号を返すためである
          # (本リポジトリの `.secrets.baseline` でも `.github/workflows/detect-secrets.yml`
          # の 2 エントリが 49 行・73 行、いずれも `run: |` の行を指している)。
          # 既存の `run:` ブロックの内側に 1 行だけ混入させる PR では `run:` キーの行が
          # 差分に含まれないため、`-filter-mode=added` が診断を捨ててしまい、
          # アノテーションも `-fail-level=any` の発火も起きずジョブが green になる。
          reviewdog \
            -f=rdjson \
            -name=detect-secrets \
            -reporter=github-pr-review \
            -filter-mode=added \
            < "${RUNNER_TEMP}/detect-secrets.rdjson"

          # 合否は差分フィルタを通す前の検知結果 (new-secrets.json) の件数で直接ゲートする。
          # これにより、行番号がずれてアノテーションを出せなかった場合でもジョブは失敗する。
          NEW_COUNT="$(jq 'length' "${RUNNER_TEMP}/new-secrets.json")"
          if [ "$NEW_COUNT" -ne 0 ]; then
            echo "::error::detect-secrets が baseline に無い検知を ${NEW_COUNT} 件報告しました。"
            jq -r '.[] | "\(.file):\(.line_number) \(.type)"' "${RUNNER_TEMP}/new-secrets.json"
            exit 1
          fi
