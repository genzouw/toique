name: PR Detect-Secrets Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-detect-secrets-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # reviewdog が PR にコメントするために必要

jobs:
  reviewdog-detect-secrets:
    name: reviewdog / detect-secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install detect-secrets
        run: |
          set -euo pipefail
          export UV_TOOL_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$UV_TOOL_BIN_DIR"
          uv tool install detect-secrets==1.5.0
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      # PR checkout の `.secrets.baseline` は same-repository PR の作成者が自由に書き換えられる
      # ため、比較対象として信頼できない (CWE-693)。作成者が自分の混入させたシークレットと
      # 一致する filename + hashed_secret + type のエントリを追加すれば、後段の jq 比較で
      # 検知結果を握りつぶせてしまう。そのため比較用の baseline は常に PR のベースブランチ
      # (信頼済みリビジョン) から取得し、PR 側の変更を一切反映しない固定データとして扱う。
      - name: Fetch trusted baseline from PR base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # 浅い checkout (fetch-depth: 1) のままでは base SHA のコミットオブジェクトが
          # ローカルに存在しないため、比較に必要なそのコミットだけを追加で取得する。
          git fetch --depth=1 origin "$PR_BASE_SHA"
          git show "$PR_BASE_SHA:.secrets.baseline" > "${RUNNER_TEMP}/trusted-baseline.json"

      # 本ワークフローを新規追加する本PRでは、base revision (main) にまだ
      # `.github/workflows/pr-detect-secrets-review.yml` 自体が存在しないため、
      # 直前のステップで取得した trusted baseline にもこのファイルのエントリが無い。
      # その結果、本ワークフローが構造上必ず含む既知の誤検知（バージョン固定文字列
      # `detect-secrets==1.5.0` がキーワード検出のパターンに偶然一致するもの）が、
      # 毎回「新規シークレット」として検出されてしまう。
      #
      # この固定例外は `.secrets.baseline`（PRごとにスキャン結果として自由に再生成・
      # 書き換え可能なデータ）とは異なり、本ワークフロー自身のコードレビューを経て
      # 初めて追加・変更できる不変値であり、file + hashed_secret + type の組み合わせを
      # 1件ずつ明示するため、`.secrets.baseline` を比較対象に戻すこと（CWE-693）とは
      # 性質が異なる。
      #
      # 本PRのマージ後は base revision の `.secrets.baseline` にもこのエントリが
      # 登録されるため、以降のPRではこの固定例外は冗長（無害だが不要）になる。
      - name: Define trusted fixed exceptions
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/fixed-exceptions.json" <<'JSON'
          [
            {
              "file": ".github/workflows/pr-detect-secrets-review.yml",
              "hashed_secret": "332a4628a93ff0ea43134469d6b412e272643515",
              "type": "Secret Keyword"
            }
          ]
          JSON

      # detect-secrets scan を実行し、`.secrets.baseline` に未登録の新規シークレットのみを
      # reviewdog に渡せるように rdjson フォーマットに変換する。
      #
      # `--baseline` フラグは意図的に使わない。detect-secrets は `scan --baseline <file>`
      # 実行時に <file> の filters_used をそのままスキャン設定として読み込み、file:// スキームの
      # フィルタが指定されていれば任意コードを実行してしまう (CWE-94、detect-secrets.yml の
      # 同種コメント参照)。そのため baseline は常に「スキャン結果と比較するための静的な JSON
      # データ」としてのみ扱い、jq でのキー比較 (filename + hashed_secret + type) によって
      # 登録済みシークレットを除外する。
      - name: Run detect-secrets and report via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # `--baseline` を渡さず、カレントディレクトリ以下のすべてを対象にスキャンする。
          # ただし `.secrets.baseline` 自身は除外する。
          detect-secrets scan --exclude-files '^\.secrets\.baseline$' -n > "${RUNNER_TEMP}/detect-secrets.json" || true

          # スキャン結果と baseline それぞれを filename + hashed_secret + type のキーに正規化し、
          # baseline に無いもの（= 新規シークレット）だけを残す。
          # 比較対象の baseline は PR checkout のものではなく、直前のステップで取得した
          # ベースブランチ (信頼済みリビジョン) の内容を使う。
          jq -S '[.results | to_entries[] | .key as $file | .value[] | {file: $file, hashed_secret, type, line_number}]' \
            "${RUNNER_TEMP}/detect-secrets.json" > "${RUNNER_TEMP}/scan-entries.json"
          jq -S '[.results | to_entries[] | .key as $file | .value[] | {file: $file, hashed_secret, type}]' \
            "${RUNNER_TEMP}/trusted-baseline.json" > "${RUNNER_TEMP}/baseline-entries.json"

          # 信頼済みリビジョンの baseline に、本ワークフロー自身の固定例外（前ステップ参照）を
          # 加えたものを最終的な比較対象とする。
          jq -s 'add' "${RUNNER_TEMP}/baseline-entries.json" "${RUNNER_TEMP}/fixed-exceptions.json" \
            > "${RUNNER_TEMP}/trusted-entries.json"

          jq -n \
            --slurpfile scan "${RUNNER_TEMP}/scan-entries.json" \
            --slurpfile baseline "${RUNNER_TEMP}/trusted-entries.json" \
            '$scan[0] | map(select(. as $s | ($baseline[0] | any(.file == $s.file and .hashed_secret == $s.hashed_secret and .type == $s.type)) | not))' \
            > "${RUNNER_TEMP}/new-secrets.json"

          # 新規シークレットの一覧 (JSON) を jq で rdjson (Reviewdog Diagnostic JSON) に変換する
          jq -r '
            {
              source: {
                name: "detect-secrets",
                url: "https://github.com/Yelp/detect-secrets"
              },
              diagnostics: [
                .[] | {
                  message: ("High-entropy secret detected: " + .type),
                  location: {
                    path: .file,
                    range: {
                      start: {
                        line: .line_number
                      }
                    }
                  },
                  severity: "ERROR"
                }
              ]
            }
          ' "${RUNNER_TEMP}/new-secrets.json" > "${RUNNER_TEMP}/detect-secrets.rdjson"

          reviewdog \
            -f=rdjson \
            -name=detect-secrets \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=any \
            < "${RUNNER_TEMP}/detect-secrets.rdjson"
