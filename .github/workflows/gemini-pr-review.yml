name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Gemini API Key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY is not set. Skipping AI Code Review."
          fi

      - name: Calculate PR Diff Size
        if: steps.check_key.outputs.has_key == 'true'
        id: check_diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          DIFF_LINES=$(git diff origin/$BASE_REF...HEAD | wc -l)
          if [ "$DIFF_LINES" -lt 20 ]; then
            echo "skip_review=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR diff is too small ($DIFF_LINES lines), skipping review to save API quota."
          else
            echo "skip_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini Code Review
        if: steps.check_key.outputs.has_key == 'true' && steps.check_diff.outputs.skip_review == 'false'
        uses: petarzarkov/gemini-code-review-action@db0558aaebc97373346194ed926bef6b15962512
        with:
          model: "gemini-2.5-flash"
          language: "Japanese"
          enable_conversation_context: "true"
          skip_draft_prs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
