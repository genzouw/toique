name: Pre-commit Auto-update

on:
  schedule:
    # 毎週月曜 08:00 JST (= 日曜 23:00 UTC) に実行
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    name: Auto-update pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      # detect-secrets の版は .pre-commit-config.yaml の rev だけでなく
      # .secrets.baseline / .husky/pre-commit / package.json / docs にも固定されており、
      # rev だけを上げるとフォールバック経路 (pre-commit framework 未導入の環境) が
      # バージョン不一致で実行を拒否し、エントロピースキャンが丸ごと止まる。
      # ベースライン再生成を伴うため自動更新の対象外とし、gitleaks のみ追従させる。
      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate --freeze --repo https://github.com/gitleaks/gitleaks

      # 更新後のフックが実際に動作することを確認する。
      # 本リポジトリには .pre-commit-config.yaml を検証するCIジョブが無く、
      # 生成PRのCIが全て緑でも設定の妥当性は担保されないため、ここで検証する。
      # 失敗した場合はPRを作らず、壊れた更新が取り込まれるのを防ぐ。
      - name: Verify updated hooks
        run: |
          pre-commit install-hooks
          pre-commit run --all-files --show-diff-on-failure

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT_FOR_MODELS }}
          commit-message: 'chore(security): 🔒 update pre-commit hooks'
          branch: 'chore/pre-commit-autoupdate'
          base: 'main'
          title: 'chore(security): 🔒 pre-commit フックの自動更新'
          body: |
            ## 概要
            定期監査の一環として、ローカルのセキュリティ検知ツール `gitleaks` のバージョンを最新に保つため、`pre-commit autoupdate` を実行しました。

            ## 変更内容
            - `.pre-commit-config.yaml` 内の `gitleaks` のバージョン更新

            なお `detect-secrets` は `.secrets.baseline` の再生成を伴うため自動更新の対象外です (手動更新)。

            ## マージ前の確認事項
            - CI が正常に通過していることを確認してください。
            - 検知ツールのメジャーバージョンアップが含まれる場合、破壊的変更（ルールの変更など）がないか確認してください。
          labels: 'dependencies, github-actions'
          assignees: 'genzouw'
          reviewers: 'genzouw'
