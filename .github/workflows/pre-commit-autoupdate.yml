name: Pre-commit Auto-update

on:
  schedule:
    # 毎週月曜 08:00 JST (= 日曜 23:00 UTC) に実行
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    name: Auto-update pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7.0.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(security): 🔒 update pre-commit hooks'
          branch: 'chore/pre-commit-autoupdate'
          title: 'chore(security): 🔒 pre-commit フックの自動更新'
          body: |
            ## 概要
            定期監査の一環として、ローカルのセキュリティ検知ツール (`gitleaks`, `detect-secrets` 等) のバージョンを最新に保つため、`pre-commit autoupdate` を実行しました。

            ## 変更内容
            - `.pre-commit-config.yaml` 内のフックのバージョン更新

            ## マージ前の確認事項
            - CI が正常に通過していることを確認してください。
            - 検知ツールのメジャーバージョンアップが含まれる場合、破壊的変更（ルールの変更など）がないか確認してください。
          labels: 'dependencies, security'
          assignees: 'genzouw'
          reviewers: 'genzouw'
