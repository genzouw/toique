name: TruffleHog

on:
  push:
  pull_request:
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC) に履歴全体を再スキャン
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for leaked secrets (TruffleHog)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scan base
        id: scan-base
        # 到達性ガードの実装は composite action に一本化している。詳細は
        # .github/actions/resolve-scan-base/action.yml を参照。
        uses: ./.github/actions/resolve-scan-base

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@cc1fe982afc515d2991365ce8d4d0dd07170fcad # v3.97.2
        with:
          # base が空文字の場合は「base 指定なし = head までの履歴全体をスキャン」となり、
          # schedule 実行と同じ経路に落ちる。これは部分検査への劣化ではなく、より広い範囲を
          # 検査する安全側の挙動である。
          #
          # 逆に到達不能なコミットを base に渡すと TruffleHog は
          # "unable to resolve commit: object not found" で内部エラーになるにもかかわらず
          # ジョブは success で終了し、chunks:0 / bytes:0 で 1 バイトも検査されないまま
          # 秘密情報スキャンが無言で無効化される fail open となる
          # (実機ログで確認済み: run 31062805632)。
          base: ${{ steps.scan-base.outputs.base }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified
