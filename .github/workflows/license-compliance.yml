name: License Compliance

on:
  push:
  pull_request:
  schedule:
    # 毎週月曜 08:00 JST (= 日曜 23:00 UTC) に実行
    - cron: '0 23 * * 0'
  workflow_dispatch:

concurrency:
  group: license-compliance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license_check:
    name: OSS License Compliance Check
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
          cache: 'bun'

      # infra は package-lock.json を採用した npm ワークスペースで bun.lock を持たない。
      # bun install だと --frozen-lockfile が実質無効化され、nested overrides
      # (minimatch@3.1.5 → brace-expansion) も無視されるため、infra だけ npm で監査する。
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies (Root)
        run: bun install --frozen-lockfile

      - name: Check Licenses (Root)
        run: bun x license-checker-rseidelsohn@4.4.2 --failOn "GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later" --summary

      - name: Install dependencies (Backend)
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Check Licenses (Backend)
        working-directory: backend
        run: bun x license-checker-rseidelsohn@4.4.2 --failOn "GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later" --summary

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check Licenses (Frontend)
        working-directory: frontend
        run: bun x license-checker-rseidelsohn@4.4.2 --failOn "GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later" --summary

      - name: Install dependencies (Infra)
        working-directory: infra
        run: npm ci

      - name: Check Licenses (Infra)
        working-directory: infra
        run: npx license-checker-rseidelsohn@4.4.2 --failOn "GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later" --summary
