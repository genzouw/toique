name: Forbidden Paths Check

# ローカルの Husky (`.husky/pre-commit`) や `lint-staged` (`package.json`) に設定されている
# 「存在自体がリスクとなるファイル（シークレットそのもの、インフラの状態ファイル、AIの作業跡など）」が、
# `--no-verify` 等でバイパスされてコミット・プッシュされた場合に、
# CI 上で確実に検知してマージをブロックするためのワークフローです。
# 参考: docs/security/leak-prevention.md

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: forbidden-paths-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-forbidden-paths:
    name: Check for forbidden file paths
    # public リポジトリでの PR スキャン漏れを防ぎつつ、内部 PR の重複実行を防ぐ
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push 時は PR と異なり github.event.before が存在する（新規ブランチ時はゼロSHAなので注意）
          fetch-depth: 0
          persist-credentials: false

      - name: Check file paths
        env:
          # `${{ }}` を run ブロック内に直接展開するとシェルへのコード注入経路になる
          # (zizmor template-injection)。env 経由で渡し、シェル変数として参照する。
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # 対象とするコミットの変更ファイルを取得する。
          # `git diff` は範囲の両端のツリーしか比較しないため、範囲内で追加後に削除された
          # 機密ファイルを見逃す（.husky/pre-push と同じ理由）。`git log --name-only` で
          # 範囲内の全コミットの変更パスを個別に列挙し、途中経過のコミットも漏れなく検査する。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR の場合: PR のベースブランチと HEAD の間の全コミット
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Checking files changed in PR commits (from $BASE_SHA to $HEAD_SHA)..."
            if ! CHANGED_FILES=$(git log --name-only --pretty=format: --diff-filter=d "$BASE_SHA".."$HEAD_SHA" 2>/dev/null | sort -u); then
              echo "::error::Unable to inspect the complete commit range (from $BASE_SHA to $HEAD_SHA). Failing closed instead of falling back to a partial check."
              exit 1
            fi
          else
            # push 等の場合: 直前のコミットから今回のコミットまでの全コミット
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"
            # 新規ブランチの push の場合は before が all zero SHA になる
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
              # 新規ブランチの場合、push 完了時点で origin 上の当該ブランチは既に CURRENT_SHA と
              # 一致してしまっているため `git log CURRENT_SHA --not --remotes` は自分自身を除外して
              # 空になり検知漏れとなる。デフォルトブランチとの差分となる履歴を検査することで、
              # 途中で追加後に削除されたファイルも見逃さないようにする。
              echo "New branch push detected or before SHA is empty. Checking commit history since origin/$DEFAULT_BRANCH..."
              if ! CHANGED_FILES=$(git log "$CURRENT_SHA" --not "origin/$DEFAULT_BRANCH" --name-only --pretty=format: --diff-filter=d 2>/dev/null | sort -u); then
                echo "::error::Unable to inspect the complete commit history for the new branch (against origin/$DEFAULT_BRANCH). Failing closed instead of falling back to a partial check."
                exit 1
              fi
            else
              echo "Checking files changed in push commits (from $BEFORE_SHA to $CURRENT_SHA)..."
              if ! CHANGED_FILES=$(git log --name-only --pretty=format: --diff-filter=d "$BEFORE_SHA".."$CURRENT_SHA" 2>/dev/null | sort -u); then
                echo "::error::Unable to inspect the complete commit range (from $BEFORE_SHA to $CURRENT_SHA). Failing closed instead of falling back to a partial check."
                exit 1
              fi
            fi
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No files to check."
            exit 0
          fi

          # 正規表現は .husky/pre-commit と同等のものを指定（削除ファイルは git diff --diff-filter=d で既に除外済み）
          # `.env.example` 等のテンプレート（機密値を含まない雛形）は正当にコミットされるため、
          # 2 段目の `grep -Ev` で明示的に許可リスト化して誤検知を防ぐ。
          FORBIDDEN_FILES=$(echo "$CHANGED_FILES" \
            | grep -E '((^|/)\.env.*|\.cursor/.*|\.claude/.*|\.aider.*|\.windsurf/.*|\.jules/.*|\.Jules/.*|.*credentials.*\.json|.*secret.*\.json|.*\.pem|.*\.key|.*\.p12|.*\.p8|.*\.keystore|.*\.jks|.*_rsa|.*_ed25519|.*_ecdsa|.*\.sqlite|.*\.db|.*\.log|\.npmrc|\.netrc|.*\.tfstate(\..*)?|(^|/)cdktf\.out(/.*)?|(^|/)\.terraform(/.*)?|.*\.(http|rest|patch|diff|local))$' \
            | grep -Ev '(^|/)\.env\.(example|sample|template|dist)$' \
            || true)

          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::🚨 [Security Error] The following sensitive files or AI footprints were detected in this change:"
            echo "$FORBIDDEN_FILES"
            echo "Please remove them and ensure they are added to .gitignore."
            exit 1
          fi

          echo "✅ No forbidden paths found in the changed files."
