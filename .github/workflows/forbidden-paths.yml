name: Forbidden Paths Check

# ローカルの Husky (`.husky/pre-commit`) や `lint-staged` (`package.json`) に設定されている
# 「存在自体がリスクとなるファイル（シークレットそのもの、インフラの状態ファイル、AIの作業跡など）」が、
# `--no-verify` 等でバイパスされてコミット・プッシュされた場合に、
# CI 上で確実に検知してマージをブロックするためのワークフローです。
# 参考: docs/security/leak-prevention.md

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: forbidden-paths-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-forbidden-paths:
    name: Check for forbidden file paths
    # public リポジトリでの PR スキャン漏れを防ぎつつ、内部 PR の重複実行を防ぐ
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push 時は PR と異なり github.event.before が存在する（新規ブランチ時はゼロSHAなので注意）
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scan base
        id: scan-base
        # 到達性ガードの実装は composite action に一本化している。詳細は
        # .github/actions/resolve-scan-base/action.yml を参照。
        uses: ./.github/actions/resolve-scan-base

      - name: Check file paths
        env:
          # `${{ }}` を run ブロック内に直接展開するとシェルへのコード注入経路になる
          # (zizmor template-injection)。env 経由で渡し、シェル変数として参照する。
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_CURRENT_SHA: ${{ github.sha }}
          SCAN_BASE: ${{ steps.scan-base.outputs.base }}
        run: |
          set -euo pipefail

          # 対象とするコミットの変更ファイルを取得する。
          # `git diff` は範囲の両端のツリーしか比較しないため、範囲内で追加後に削除された
          # 機密ファイルを見逃す（.husky/pre-push と同じ理由）。`git log --name-only` で
          # 範囲内の全コミットの変更パスを個別に列挙し、途中経過のコミットも漏れなく検査する。

          # pull_request では merge commit である github.sha ではなく PR の head を終点にする。
          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEAD_SHA="$PR_HEAD_SHA"
          else
            HEAD_SHA="$PUSH_CURRENT_SHA"
          fi

          # SCAN_BASE は Resolve scan base ステップ（composite action）の出力。
          # 空文字は「起点にできる直前コミットが無い」ことを意味する。
          if [ -n "$SCAN_BASE" ]; then
            echo "コミット範囲 ($SCAN_BASE..$HEAD_SHA) の変更ファイルを確認します..."
            if ! CHANGED_FILES=$(git log --name-only --pretty=format: --diff-filter=d "$SCAN_BASE".."$HEAD_SHA" 2>/dev/null | sort -u); then
              echo "::error::Unable to inspect the complete commit range (from $SCAN_BASE to $HEAD_SHA). Failing closed instead of falling back to a partial check."
              exit 1
            fi
          else
            # 新規ブランチの push の場合は before が all zero SHA になる。
            # また force-push（dependabot の rebase 等）では旧 HEAD が孤児化して到達不能になり、
            # before の実体がリポジトリに存在しなくなるため `git log BEFORE..CURRENT` が必ず失敗する。
            # 新規ブランチの場合、push 完了時点で origin 上の当該ブランチは既に HEAD_SHA と
            # 一致してしまっているため `git log HEAD_SHA --not --remotes` は自分自身を除外して
            # 空になり検知漏れとなる。デフォルトブランチとの差分となる履歴を検査することで、
            # 途中で追加後に削除されたファイルも見逃さないようにする。
            # force-push 後も旧コミットは GitHub 上から到達不能となるため、この経路は
            # 「現存するブランチの実体」に対する完全な検査であり fail closed の設計意図を損なわない。
            echo "新規ブランチの push、before SHA が空、または before SHA が到達不能（force-push）を検知しました。origin/$DEFAULT_BRANCH との差分となるコミット履歴を確認します..."
            if ! CHANGED_FILES=$(git log "$HEAD_SHA" --not "origin/$DEFAULT_BRANCH" --name-only --pretty=format: --diff-filter=d 2>/dev/null | sort -u); then
              echo "::error::Unable to inspect the complete commit history for the new branch (against origin/$DEFAULT_BRANCH). Failing closed instead of falling back to a partial check."
              exit 1
            fi
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No files to check."
            exit 0
          fi

          # 正規表現は .husky/pre-commit と同等のものを指定（削除ファイルは git diff --diff-filter=d で既に除外済み）
          # `.env.example` 等のテンプレート（機密値を含まない雛形）は正当にコミットされるため、
          # 2 段目の `grep -Ev` で明示的に許可リスト化して誤検知を防ぐ。
          FORBIDDEN_FILES=$(echo "$CHANGED_FILES" \
            | grep -E '((^|/)\.env.*|\.cursor/.*|\.claude/.*|\.aider.*|\.windsurf/.*|\.jules/.*|\.Jules/.*|.*credentials.*\.json|.*secret.*\.json|.*\.pem|.*\.key|.*\.p12|.*\.p8|.*\.keystore|.*\.jks|.*_rsa|.*_ed25519|.*_ecdsa|.*\.sqlite|.*\.db|.*\.log|\.npmrc|\.netrc|.*\.tfstate(\..*)?|(^|/)cdktf\.out(/.*)?|(^|/)\.terraform(/.*)?|.*\.(http|rest|patch|diff|local))$' \
            | grep -Ev '(^|/)\.env\.(example|sample|template|dist)$' \
            || true)

          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::🚨 [Security Error] The following sensitive files or AI footprints were detected in this change:"
            echo "$FORBIDDEN_FILES"
            echo "Please remove them and ensure they are added to .gitignore."
            exit 1
          fi

          echo "✅ No forbidden paths found in the changed files."
