name: OSV-Scanner

# 全件検査は main への push・週次スケジュール・手動実行だけで行う。
# PR では base との差分検査 (PR で新しく入った脆弱性だけを検出) に切り替える。
# 全件検査を PR でも走らせると、無関係な新規公開の脆弱性で open な PR がすべて止まる
# (Renovate の PR が OSV-Scanner で一斉に落ちた事象の再発防止)。
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 毎週月曜 06:30 JST (= 日曜 21:30 UTC) に実行
    - cron: '30 21 * * 0'
  workflow_dispatch:

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv-scanner:
    name: Scan for vulnerabilities (OSV-Scanner)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SARIF は結果をすべてファイルへ書き出すため、失敗しても Actions のログには
      # `Exit code: 1` しか残らず、ジョブログだけでは原因を追えない。
      # 先に table 形式で同じスキャンを流し、検出内容をログ上で読めるようにする。
      # ここでの失敗はジョブの合否に影響させない（判定は後続の SARIF スキャンが行う）。
      - name: Run OSV-Scanner (human-readable output)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            -r
            --config=infra/osv-scanner.toml
            --format=table
            ./

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            -r
            --config=infra/osv-scanner.toml
            --format=sarif
            --output=results.sarif
            ./

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: osv-scanner

  # PR では base と head を両方スキャンし、PR で新しく入った脆弱性だけを失敗にする。
  # 既存の脆弱性は main の全件検査 (osv-scanner ジョブ) が拾うため、検出の網は狭まらない。
  # 公式ドキュメント: https://google.github.io/osv-scanner/github-action/#scan-on-pull-request
  osv-scanner-pr:
    name: Scan for new vulnerabilities in PR (OSV-Scanner)
    if: github.event_name == 'pull_request'
    permissions:
      # 呼び出される再利用可能ワークフローが要求する権限 (呼び出し側で許可しないと startup_failure になる)
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        -r
        --config=infra/osv-scanner.toml
        ./
      # SARIF のアップロード先 (category: osv-scanner) は全件検査と分けるため、PR では上げない。
      upload-sarif: false
