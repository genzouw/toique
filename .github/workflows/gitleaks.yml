name: Gitleaks

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Dependabot (github-actions ecosystem) が自動で PR を出す。
# 必須チェック (context: "gitleaks / Scan for leaked secrets") のため paths フィルタ禁止。
on:
  push:
  pull_request:
  schedule:
    # 毎週月曜 05:00 JST (= 日曜 20:00 UTC) に履歴全体を再スキャン
    - cron: '0 20 * * 0'
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    # v1.0.1 時点の reusable workflow は gitleaks 8.21.2 を直接インストールしており、
    # pr-secret-review.yml が参照する setup-gitleaks composite action（8.30.1）とバージョンが
    # 乖離していた（同一リポジトリの2つのシークレットゲートが別バージョンで走る状態）。
    # ci-workflows#14 のマージにより本 reusable workflow 自体も composite action 経由に
    # 変更されたため、参照 SHA を main HEAD（pr-secret-review.yml と同じコミット）に更新し、
    # gitleaks のバージョンを single source of truth である composite action の既定値に統一する。
    uses: genzouw/ci-workflows/.github/workflows/gitleaks.yml@495b912a4b3fe810533654274098528f4ea79510 # genzouw/ci-workflows#14 (composite action 経由に統一, 8.30.1)
