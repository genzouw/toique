name: AI A11y Scanner
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    if: '!github.event.pull_request.draft'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check PR diff size and frontend changes
        id: diff-check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          DIFF=$(git diff "origin/$BASE_REF...HEAD" -- frontend/src)
          DIFF_LENGTH=${#DIFF}
          CHANGED_LINES=$(git diff "origin/$BASE_REF...HEAD" -- frontend/src | grep -E '^[+-]' | grep -vc -E '^(\-\-\-|\+\+\+)' || true)
          if [ -z "$DIFF" ] || [ "$DIFF_LENGTH" -lt 20 ] || [ "$CHANGED_LINES" -lt 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Frontend PR diff is trivial or empty. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          git diff "origin/$BASE_REF...HEAD" -- frontend/src > pr_diff.txt

      - name: Check for Gemini API Key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY is not set. Skipping AI A11y Scanner."
          fi

      - name: Run AI A11y Scanner
        if: steps.diff-check.outputs.skip == 'false' && steps.check_key.outputs.has_key == 'true'
        run: uv run .github/scripts/ai-a11y-scanner.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_DIFF_PATH: pr_diff.txt
