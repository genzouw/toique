name: AI Accessibility Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**/*.tsx'
      - 'frontend/**/*.jsx'
      - 'frontend/**/*.html'

permissions:
  pull-requests: write
  contents: read

jobs:
  a11y-scan:
    name: AI Accessibility Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Gemini API Key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY is not set. Skipping AI Accessibility Scanner."
          fi

      - name: Calculate PR Diff Size
        if: steps.check_key.outputs.has_key == 'true'
        id: check_diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          DIFF_LINES=$(git diff "origin/$BASE_REF...HEAD" | wc -l)
          if [ "$DIFF_LINES" -lt 20 ]; then
            echo "skip_scan=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR diff is too small ($DIFF_LINES lines), skipping scan to save API quota."
          else
            echo "skip_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Reviewdog
        if: steps.check_key.outputs.has_key == 'true' && steps.check_diff.outputs.skip_scan == 'false'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Setup uv
        if: steps.check_key.outputs.has_key == 'true' && steps.check_diff.outputs.skip_scan == 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Extract Trusted Scanner Script
        # pull_request イベントでは PR 提出者が制御する head 側のコードがチェックアウトされる。
        # GEMINI_API_KEY と write 権限を持つ GITHUB_TOKEN を扱う環境で head 側のスクリプトを
        # そのまま実行すると、悪意あるフォークが script を書き換えて secrets を持ち出せてしまう。
        # base ref（マージ先ブランチ）にある信頼済みのスクリプトのみを実行対象とする。
        if: steps.check_key.outputs.has_key == 'true' && steps.check_diff.outputs.skip_scan == 'false'
        id: extract_script
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/${BASE_REF}:.github/scripts/a11y-scanner.py" 2>/dev/null; then
            git show "origin/${BASE_REF}:.github/scripts/a11y-scanner.py" > /tmp/a11y-scanner.py
            echo "script_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::base ref (${BASE_REF}) に .github/scripts/a11y-scanner.py が存在しないため、スキャンをスキップします。"
            echo "script_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI Accessibility Scanner Script
        if: steps.check_key.outputs.has_key == 'true' && steps.check_diff.outputs.skip_scan == 'false' && steps.extract_script.outputs.script_available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run /tmp/a11y-scanner.py | reviewdog -f=rdjson -reporter=github-pr-review -name="AI A11y Scanner" -level=warning
