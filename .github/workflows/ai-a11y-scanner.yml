name: AI Accessibility Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  a11y-scan:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Base Branch and Check Diff Size
        id: check_diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          DIFF_CONTENT=$(git diff "origin/$BASE_REF...HEAD")
          DIFF_LENGTH=${#DIFF_CONTENT}
          CHANGED_LINES=$(echo "$DIFF_CONTENT" | grep -E '^(\+|\-)' | grep -Ev '^(---|\+\+\+)' | wc -l || echo 0)

          if [ "$DIFF_LENGTH" -lt 20 ] || [ "$CHANGED_LINES" -lt 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Diff is trivial (length: $DIFF_LENGTH, lines: $CHANGED_LINES). Skipping AI a11y review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          # Pass diff to subsequent steps
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "diff<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_CONTENT" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Check for Gemini API Key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY is not set. Skipping AI a11y review."
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.check_diff.outputs.skip != 'true' && steps.check_key.outputs.has_key == 'true'

      - name: Run A11y Scanner Script
        if: steps.check_diff.outputs.skip != 'true' && steps.check_key.outputs.has_key == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_DIFF: ${{ steps.check_diff.outputs.diff }}
        run: uv run .github/scripts/a11y-scanner.py

      - name: Set up reviewdog
        if: steps.check_diff.outputs.skip != 'true' && steps.check_key.outputs.has_key == 'true'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f
        with:
          reviewdog_version: v0.20.0

      - name: Report via Reviewdog
        if: steps.check_diff.outputs.skip != 'true' && steps.check_key.outputs.has_key == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f rdjson.json ]; then
            reviewdog -f=rdjson \
              -name="a11y-scanner" \
              -reporter=github-pr-review \
              -filter-mode=added \
              -fail-level=any \
              < rdjson.json
          fi
