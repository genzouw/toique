name: AI Accessibility Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  a11y-scan:
    name: AI Accessibility Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Diff Size
        id: diff-check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          DIFF_CONTENT=$(git diff origin/$BASE_REF...HEAD)
          DIFF_LEN=${#DIFF_CONTENT}
          CHANGED_LINES=$(git diff origin/$BASE_REF...HEAD | grep -cE '^[+-][^+-]' || true)

          if [ "$DIFF_LEN" -lt 20 ] || [ "$CHANGED_LINES" -lt 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Diff size is trivial (length: $DIFF_LEN, changed lines: $CHANGED_LINES). Skipping a11y scanner to save quotas."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.diff-check.outputs.skip != 'true'

      - name: Run A11y Scanner script
        id: a11y-scanner
        if: steps.diff-check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set. Skipping AI A11y Scan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run .github/scripts/a11y-scanner.py > a11y-results.json

      - name: Setup Reviewdog
        if: steps.diff-check.outputs.skip != 'true' && steps.a11y-scanner.outputs.skip != 'true'
        uses: reviewdog/action-setup@3f401fc1d1c7c9e1049f5068fec6b0ea5978f654 # v1.3.0
        with:
          reviewdog_version: latest

      - name: Run Reviewdog
        if: steps.diff-check.outputs.skip != 'true' && steps.a11y-scanner.outputs.skip != 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f a11y-results.json ]; then
            cat a11y-results.json | reviewdog -f=rdjson -reporter=github-pr-review -name="AI A11y Scanner"
          fi
