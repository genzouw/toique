name: AI Accessibility & UI Review

on:
  pull_request:
    paths:
      - 'frontend/**/*.tsx'
      - 'frontend/**/*.ts'
      - 'frontend/**/*.jsx'
      - 'frontend/**/*.js'

permissions:
  contents: read
  pull-requests: write

jobs:
  a11y-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@887a942a15af3a76af60a460e8d01080b06428c6 # v5.1.0

      - name: Check PR diff size
        id: check_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF_LINES=$(gh pr view ${{ github.event.pull_request.number }} --json additions,deletions --jq '.additions + .deletions')
          echo "Total changed lines: $DIFF_LINES"
          if [ "$DIFF_LINES" -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "PR is too small, skipping AI review."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: AI UI Review Script
        if: steps.check_diff.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run .github/scripts/gemini_a11y_review.py
