name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    name: Gemini AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
        with:
          fetch-depth: 0

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: latest

      - name: Check for GEMINI_API_KEY
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY is not set. Skipping Gemini PR Review."
          fi

      - name: Run Gemini Code Review
        if: steps.check_key.outputs.has_key == 'true'
        uses: petarzarkov/gemini-code-review-action@e8e786b3b05e3bb3139072f05ae6c1ad9cba3027
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_model: "gemini-2.5-flash"
          language: "ja-JP"
          system_message: "あなたは経験豊富なシニアソフトウェアエンジニアです。提供されたコード変更をレビューし、バグの可能性、パフォーマンスの改善、セキュリティの脆弱性、およびベストプラクティスについてコメントしてください。コードが問題ない場合は賞賛することも忘れないでください。出力はReviewdog Diagnostic (rdjson)形式に適合するようにJSONを生成してください。"
