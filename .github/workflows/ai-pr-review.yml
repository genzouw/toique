name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check PR Diff Size
        id: check_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          diff=$(gh pr diff ${{ github.event.pull_request.number }})
          prDiff=$(echo "$diff" | wc -c)
          changedLineCount=$(echo "$diff" | wc -l)
          if [ -z "$diff" ] || [ "$prDiff" -lt 20 ] || [ "$changedLineCount" -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "PR diff is trivial or empty. Skipping AI review to save quota."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run AI Code Review
        if: steps.check_diff.outputs.skip == 'false'
        uses: petarzarkov/gemini-code-review-action@e8e786b3b05e3bb3139072f05ae6c1ad9cba3027
        with:
          model: gemini-2.5-flash
          enable_conversation_context: true
          skip_draft_prs: true
          language: "Japanese"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
