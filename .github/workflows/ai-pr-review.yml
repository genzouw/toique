name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check PR diff size
        id: check_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 差分サイズを取得して、小さすぎる場合はAPIを呼ばないように最適化（APIクオータ節約）
          DIFF_LINES=$(gh pr view ${{ github.event.pull_request.number }} --json additions,deletions --jq '.additions + .deletions')
          echo "Total changed lines: $DIFF_LINES"
          if [ "$DIFF_LINES" -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "PR is too small, skipping AI review."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Gemini Code Review
        if: steps.check_diff.outputs.skip == 'false'
        # 安定版のSHAを使用。petarzarkov/gemini-code-review-action@v1.1.3
        uses: petarzarkov/gemini-code-review-action@db0558aaebc97373346194ed926bef6b15962512
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-2.5-flash"
          # PR Agent or CodeRabbit also exist, but this is a lightweight direct CI alternative
          # for environments where GitHub App installs are restricted.
