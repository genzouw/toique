name: "AI PR Review"

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Get PR Diff
        id: pr_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          DIFF_LENGTH=${#DIFF}
          CHANGED_LINES=$(echo "$DIFF" | grep -c '^[+-][^+-]')
          echo "diff_length=$DIFF_LENGTH" >> $GITHUB_OUTPUT
          echo "changed_lines=$CHANGED_LINES" >> $GITHUB_OUTPUT

          # output diff to file to avoid command line length limits
          echo "$DIFF" > pr_diff.txt

      - name: Run Gemini PR Review
        if: ${{ steps.pr_diff.outputs.diff_length > 20 && steps.pr_diff.outputs.changed_lines >= 3 }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run .github/scripts/pr_review_rdjson.py pr_diff.txt > review_output.rdjson

      - name: Post Review Comments with Reviewdog
        if: ${{ steps.pr_diff.outputs.diff_length > 20 && steps.pr_diff.outputs.changed_lines >= 3 }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat review_output.rdjson | reviewdog -f=rdjson \
            -name="Gemini Code Review" \
            -reporter=github-pr-review \
            -level=warning
