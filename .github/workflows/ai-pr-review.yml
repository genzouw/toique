name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # フォークからの PR は GEMINI_API_KEY にアクセスできず GITHUB_TOKEN も読み取り専用のため、
    # 認証情報不足によるジョブ失敗を避けるため明示的にスキップする。
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR diff size
        id: check_diff
        run: |
          additions=${{ github.event.pull_request.additions }}
          deletions=${{ github.event.pull_request.deletions }}
          changed_line_count=$((additions + deletions))

          if [ "$changed_line_count" -lt 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini Code Review
        if: steps.check_diff.outputs.skip != 'true'
        # petarzarkov/gemini-code-review-action は GitHub 公式でも Verified Creator でもない
        # 個人公開の Action のため、リポジトリの Actions 許可ポリシー（Settings > Actions >
        # General > Allow selected actions）の patterns_allowed に明示登録しないと
        # startup_failure（ジョブが起動すらしない）で落ちる。登録済みであることを前提とする。
        uses: petarzarkov/gemini-code-review-action@db0558aaebc97373346194ed926bef6b15962512 # v1.1.3
        with:
          model: 'gemini-2.5-pro'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
