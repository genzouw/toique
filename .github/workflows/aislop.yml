name: AI Code Scanner (aislop)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  aislop:
    name: Run aislop
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Run aislop
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p .aislop
          # 変更されたファイルに対してスキャンを実行し、結果をSARIF形式で出力
          # 差分がない場合や問題がない場合もエラーで終了しないように "|| true" を付与
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            npx aislop@0.14.0 scan --changes --base "origin/$BASE_REF" --sarif > .aislop/results.sarif || true
          else
            npx aislop@0.14.0 scan --sarif > .aislop/results.sarif || true
          fi

      - name: Upload SARIF to GitHub Code Scanning
        # PRからの実行時はSARIFのアップロードがサポートされていない場合があるので、
        # 条件付きでスキップする。
        # セキュリティイベントへの書き込みはフォークからのPRでは通常失敗するため条件付きにする
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: .aislop/results.sarif
          category: aislop
