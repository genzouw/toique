name: pre-commit hooks

# .pre-commit-config.yaml の rev 更新 (Renovate の pre-commit manager) で
# フック環境の構築や設定ファイルの読み込みが壊れていないかを確かめる。
# paths で絞っているため必須チェックにはしない。
on:
  pull_request:
    paths:
      - .pre-commit-config.yaml
      - .gitleaks.toml
      - .gitleaksignore
      - .github/workflows/pre-commit.yml
  workflow_dispatch:

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRE_COMMIT_VERSION: '4.7.0'

jobs:
  pre-commit:
    name: Verify pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install hook environments
        run: uvx "pre-commit@${PRE_COMMIT_VERSION}" install-hooks

      - name: Run hooks
        # detect-secrets: .secrets.baseline を --baseline で読み込むと、file:// フィルタ経由で
        #   任意の Python コードを実行できる (.husky/pre-commit のゲートと detect-secrets.yml の設計を参照)。
        #   エントロピー走査は detect-secrets.yml が担うため、ここでは環境の構築だけを確かめる。
        # detect-private-key: --all-files では docs/public-release-risk-assessment.md の
        #   説明用の文字列に反応して失敗する (手元で確認済み)。コミット時はステージされた
        #   ファイルにだけ効くので、ここでは環境の構築だけを確かめる。
        env:
          SKIP: detect-secrets,detect-private-key
        run: uvx "pre-commit@${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure --color always
