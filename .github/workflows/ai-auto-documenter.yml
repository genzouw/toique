name: AI Auto Documenter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  document-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: pr_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF_CONTENT=$(git diff origin/${{ github.base_ref }}...HEAD)

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "diff<<$EOF" >> $GITHUB_OUTPUT
          echo "$DIFF_CONTENT" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

          CHANGES_COUNT=$(echo "$DIFF_CONTENT" | wc -l)
          echo "changes_count=$CHANGES_COUNT" >> $GITHUB_OUTPUT

      - name: Setup uv
        if: steps.pr_diff.outputs.changes_count >= 3 && steps.pr_diff.outputs.diff != ''
        uses: astral-sh/setup-uv@887a942a15af3a76af609919aaf322f3f83c1626 # v5.1.2
        with:
          enable-cache: true

      - name: Generate PR Documentation
        id: generate_docs
        if: steps.pr_diff.outputs.changes_count >= 3 && steps.pr_diff.outputs.diff != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_DIFF: ${{ steps.pr_diff.outputs.diff }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          uv run .github/scripts/ai_auto_documenter.py > generated_docs.md

          # Pass the markdown content to a step output for the comment action
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "docs<<$EOF" >> $GITHUB_OUTPUT
          cat generated_docs.md >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Comment PR
        if: steps.generate_docs.outputs.docs != ''
        uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2.9.0
        with:
          header: ai-auto-documenter
          message: |
            ### 🤖 AI Auto Documenter Suggestion

            ${{ steps.generate_docs.outputs.docs }}
