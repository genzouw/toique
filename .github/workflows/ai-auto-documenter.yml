name: AI Auto Documenter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  documenter:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Get PR diff
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! gh pr diff "$PR_NUMBER" > pr.diff; then
            echo "::error::Failed to fetch PR diff for #$PR_NUMBER"
            exit 1
          fi
          changed_lines=$(grep -c "^+" pr.diff || true)
          char_count=$(wc -m < pr.diff)
          if [ -z "$char_count" ] || [ "$char_count" -lt 20 ] || [ "$changed_lines" -lt 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI Documenter
        if: steps.get_diff.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .github/scripts/ai-auto-documenter.py ]; then
            echo "::warning::.github/scripts/ai-auto-documenter.py not found on default branch yet (likely introduced by this PR); skipping scan"
            echo '{"source": {"name": "AI Auto Documenter", "url": "https://github.com"}, "diagnostics": []}' > rdjson.json
          else
            uv run .github/scripts/ai-auto-documenter.py < pr.diff > rdjson.json
          fi

      - name: Setup reviewdog
        if: steps.get_diff.outputs.skip == 'false'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - name: Run reviewdog
        if: steps.get_diff.outputs.skip == 'false'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=rdjson -reporter=github-pr-review -filter-mode=added \
            -fail-level=none -level=info -name="AI Auto Documenter" < rdjson.json
