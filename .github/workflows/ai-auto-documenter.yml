name: AI Auto Documenter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  document-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get PR diff
        id: pr_diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          DIFF_CONTENT=$(git diff "origin/$BASE_REF...HEAD")

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "diff<<$EOF"
            echo "$DIFF_CONTENT"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

          CHANGES_COUNT=$(echo "$DIFF_CONTENT" | wc -l)
          echo "changes_count=$CHANGES_COUNT" >> "$GITHUB_OUTPUT"

      - name: Setup uv
        if: steps.pr_diff.outputs.changes_count >= 3 && steps.pr_diff.outputs.diff != ''
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Generate PR Documentation
        id: generate_docs
        if: steps.pr_diff.outputs.changes_count >= 3 && steps.pr_diff.outputs.diff != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_DIFF: ${{ steps.pr_diff.outputs.diff }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          uv run .github/scripts/ai_auto_documenter.py > generated_docs.md

          # Pass the markdown content to a step output for the comment action
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "docs<<$EOF"
            cat generated_docs.md
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment PR
        if: steps.generate_docs.outputs.docs != ''
        uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2.9.0
        with:
          header: ai-auto-documenter
          message: |
            ### 🤖 AI Auto Documenter Suggestion

            ${{ steps.generate_docs.outputs.docs }}
