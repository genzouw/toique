name: AI Auto Documenter

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  document:
    name: Run AI Auto Documenter
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR Diff Size
        id: check_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Fetch PR diff to ensure we do not hit API for empty/trivial PRs
          diff=$(gh pr diff $PR_NUMBER || echo "")
          prDiff=$(echo "$diff" | wc -c)
          changedLineCount=$(echo "$diff" | wc -l)

          echo "PR Diff Size: $prDiff bytes"
          echo "Changed Lines: $changedLineCount"

          if [ -z "$diff" ] || [ "$prDiff" -lt 20 ] || [ "$changedLineCount" -lt 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR diff is trivial or empty. Skipping AI auto documenter to save quota."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI Auto Documenter
        if: steps.check_diff.outputs.skip == 'false'
        uses: petarzarkov/gemini-code-review-action@e8e786b3b05e3bb3139072f05ae6c1ad9cba3027
        with:
          model: gemini-2.5-flash
          enable_conversation_context: true
          skip_draft_prs: true
          language: "Japanese"
          prompt: |
            あなたはシニアエンジニアです。今回のPull Requestによるコード変更点について、ドキュメントが不足している箇所や、複雑なロジックに対して追加すべきドキュメントやコメントを提案してください。
            特に、外部APIとの連携部分、セキュリティに関わる変更、またはパフォーマンスに影響のあるアルゴリズムの変更について、分かりやすい日本語のドキュメント生成を提案してください。
            コード変更が軽微でドキュメントの追加が不要な場合は、コメントを残さないでください。
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
