name: "AI Web Search"
description: "Fetches context for AI using Exa, Tavily, and other search providers"

inputs:
  query:
    description: "The search query"
    required: true

outputs:
  context:
    description: "Markdown formatted search results context"
    value: ${{ steps.search.outputs.context }}

runs:
  using: "composite"
  steps:
    - name: "Setup uv"
      uses: astral-sh/setup-uv@v5

    - name: "Run search"
      id: search
      shell: bash
      env:
        QUERY: ${{ inputs.query }}
        EXA_API_KEY: ${{ env.EXA_API_KEY }}
        TAVILY_API_KEY: ${{ env.TAVILY_API_KEY }}
      run: |
        uv run ${{ github.action_path }}/search.py "$QUERY"
