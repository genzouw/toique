name: "AI Web Search"
description: "RAG web search action using Exa, Tavily, DuckDuckGo, Wikipedia, and Arxiv"

inputs:
  query:
    description: "Search query"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v5

    - name: Run Python script
      shell: bash
      env:
        QUERY: ${{ inputs.query }}
        EXA_API_KEY: ${{ env.EXA_API_KEY }}
        TAVILY_API_KEY: ${{ env.TAVILY_API_KEY }}
      run: |
        uv run ${{ github.action_path }}/search.py
