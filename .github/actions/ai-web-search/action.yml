name: 'AI Web Search'
description: 'Perform web search using various providers and extract full markdown content using Jina Reader API'

inputs:
  query:
    description: 'The search query'
    required: true
  provider:
    description: 'The search provider (exa, tavily, duckduckgo, google, wikipedia, arxiv)'
    required: true
    default: 'duckduckgo'
  max_results:
    description: 'Maximum number of results to return'
    required: false
    default: '5'

outputs:
  results:
    description: 'The search results in markdown format'
    value: ${{ steps.search.outputs.results }}

runs:
  using: 'composite'
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@887a942a15af3a76af609919aaf322f3f83c1626 # v5.1.2
      with:
        enable-cache: true

    - name: Run web search
      id: search
      shell: bash
      env:
        EXA_API_KEY: ${{ env.EXA_API_KEY }}
        TAVILY_API_KEY: ${{ env.TAVILY_API_KEY }}
        SEARCH_QUERY: ${{ inputs.query }}
        SEARCH_PROVIDER: ${{ inputs.provider }}
        MAX_RESULTS: ${{ inputs.max_results }}
      run: |
        uv run .github/actions/ai-web-search/search.py
