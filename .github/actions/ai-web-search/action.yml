name: 'AI Web Search'
description: 'RAG web search action using Exa, Tavily, DuckDuckGo, Wikipedia, and Arxiv'

inputs:
  query:
    description: 'Search query'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

    - name: Run Python script
      shell: bash
      env:
        QUERY: ${{ inputs.query }}
        EXA_API_KEY: ${{ env.EXA_API_KEY }}
        TAVILY_API_KEY: ${{ env.TAVILY_API_KEY }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        uv run "$ACTION_PATH/search.py"
