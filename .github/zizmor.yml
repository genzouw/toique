# zizmor configuration
# Reference: https://docs.zizmor.sh/configuration/

rules:
  dangerous-triggers:
    # `on:` ブロックは複数行に渡るため inline `# zizmor: ignore[...]` が効かない。
    # 代わりにファイル単位で抑制し、抑制理由は各ワークフロー先頭のコメントに残す。
    ignore:
      # branches:[main] 限定の workflow_run。CI 成功した main の内容のみを
      # Cloud Run / Cloudflare Pages にデプロイする設計で不正コード由来の実行はない。
      - deploy.yml
      # PR write 権限が必要なため pull_request_target が必須。チェックアウトは行わず、
      # `pull_request.user.login == 'dependabot[bot]'` で発火元を検証する。
      - dependabot-auto-merge.yml
  adhoc-packages:
    ignore:
      # repomix はこのワークフロー内でのみ使う単体CLIツールで、リポジトリの依存関係
      # ではない。npm パッケージロックファイルを別途作る運用コストに見合わないため、
      # `npm install --global` による導入を許容する。バージョンは latest ではなく
      # 固定値を指定しており、サプライチェーンリスクは許容範囲。
      # (具体的なバージョン番号はここに書かない。バンプのたびに乖離して
      #  抑制理由のコメントが実態と食い違う原因になるため、参照先は各ファイル1か所に限る)
      - repomix.yml
  self-repository:
    # zizmor は同一リポジトリ内の複合Action参照に self-repository 構文 ($/...) を
    # 求めるが、CIで併用している actionlint が $/ を有効なローカルアクション参照と
    # 認識せずビルドが失敗する (サポートPR rhysd/actionlint#732 は未マージ)。
    # actionlint が対応するまでは workspace-relative 形式 (./...) を維持する。
    # 参照先はいずれも自リポジトリ内の複合Actionで、外部リポジトリの混入余地はない。
    ignore:
      - detect-secrets.yml
      - forbidden-paths.yml
      - trufflehog.yml
      # 現時点で main には未追加。PR #762 で ai-web-search 複合Action と共に
      # 追加されるワークフローで、同じ理由の指摘が既に出ているため先に登録する。
      - ai-issue-triage.yml
